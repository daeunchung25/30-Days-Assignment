<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malang | Day 8 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0FA;--paper:#FFFFFF;--ink:#2B2540;--muted:#6E6886;--line:#DCDDEE;--accent:#FF6F91;--stage:#F8F6F2;--table:#E9E2D6;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16141F;--paper:#201D2C;--ink:#EEEAF8;--muted:#A49EBC;--line:#332F44;--accent:#FF86A4;--stage:#262233;--table:#312C3F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141F;--paper:#201D2C;--ink:#EEEAF8;--muted:#A49EBC;--line:#332F44;--accent:#FF86A4;--stage:#262233;--table:#312C3F;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:20px 20px 70px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.top a{color:var(--muted);font-size:14px;text-decoration:none}
.top a:hover{text-decoration:underline}
.top h1{font-family:"Jua",sans-serif;font-weight:400;font-size:22px;margin:0}
.jua{font-family:"Jua","Nunito",sans-serif;font-weight:400}

.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding-top:24px;align-items:start}
.stagewrap{position:sticky;top:14px}
.stage{position:relative;background:linear-gradient(var(--stage) 72%,var(--table) 72%);border:1px solid var(--line);border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;aspect-ratio:1;cursor:grab}
.stage canvas.down{cursor:grabbing}
.hint{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:15px;color:var(--muted);pointer-events:none;transition:opacity .4s}
.count{position:absolute;right:16px;bottom:12px;font-size:14px;color:var(--muted)}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.name{font-family:"Jua",sans-serif;font-size:22px}

.title{font-size:clamp(44px,8vw,76px);line-height:.95;margin:0 0 6px}
.lede{margin:0 0 20px;color:var(--muted);max-width:42ch}
.group{margin-bottom:20px}
.group h2{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 10px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt canvas{width:44px;height:44px}
.opt b{display:block;font-size:15px;line-height:1.2}
.opt span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:800;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#2A0C14}
.shelf{border-top:1px solid var(--line);margin-top:36px;padding-top:20px}
.shelf h2{font-family:"Jua",sans-serif;font-weight:400;font-size:24px;margin:0 0 10px}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.shelfgrid button{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:8px;cursor:pointer;text-align:center;position:relative}
.shelfgrid button:hover{border-color:var(--accent)}
.shelfgrid canvas{width:100%;aspect-ratio:1;display:block}
.shelfgrid small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.shelfgrid .rm{position:absolute;top:4px;right:6px;font-size:16px;color:var(--muted);border:0;background:none;padding:2px}
.empty{color:var(--muted);font-size:14px}
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .stagewrap{position:static}
  .title{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a id="back" href="../">Day 8 of 30</a>
    <h1>말랑 Malang</h1>
  </div>

  <div class="main">
    <div class="stagewrap">
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Your squishy. Press and hold to squish it." role="img"></canvas>
        <div class="hint" id="hint">Press and hold. Drag around to squish.</div>
        <div class="count" id="count"></div>
      </div>
      <div class="stagebar">
        <span class="name" id="name"></span>
        <span style="display:flex;gap:8px">
          <button class="btn" id="sound" type="button" aria-pressed="true">Sound on</button>
          <button class="btn hot" id="keep" type="button">Keep it</button>
        </span>
      </div>
    </div>

    <div>
      <p class="title jua">말랑</p>
      <p class="lede">Build a squishy and squish it. Pick what’s inside, what it’s wrapped in, and the color.</p>
      <div class="group"><h2>Inside</h2><div class="opts" id="fills" role="group" aria-label="Filling"></div></div>
      <div class="group"><h2>Outside</h2><div class="opts" id="skins" role="group" aria-label="Skin"></div></div>
      <div class="group"><h2>Color</h2><div class="swatches" id="colors" role="group" aria-label="Color"></div></div>
    </div>
  </div>

  <section class="shelf">
    <h2>My shelf</h2>
    <div class="shelfgrid" id="shelf"></div>
  </section>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- options ---------- */
// k: how fast it springs back, damp: how much it keeps moving, depth: how far it dents, rate: how easily it gives
const FILLS={
  soft:{label:'Soft',sub:'Slow-rise foam',k:.012,damp:.82,depth:.38,spread:.9,dent:1,squash:.12,rate:3},
  crunchy:{label:'Crunchy',sub:'Beads that crackle',k:.09,damp:.8,depth:.22,spread:.75,dent:.8,squash:.07,rate:5},
  watery:{label:'Watery',sub:'Wobbly and wet',k:.13,damp:.94,depth:.3,spread:.85,dent:.8,squash:.13,rate:6},
  sherbet:{label:'Sherbet',sub:'Sandy and grainy',k:.03,damp:.78,depth:.3,spread:.8,dent:.9,squash:.09,rate:3.5},
  dough:{label:'Hard dough',sub:'Like a NeeDoh',k:.006,damp:.7,depth:.17,spread:.6,dent:.75,squash:.05,rate:1.2}
};
const SKINS={
  tape:{label:'Tape wrap',sub:'Lumpy and shiny'},
  glossy:{label:'Glossy',sub:'Smooth and shiny'},
  hotteok:{label:'Hotteok',sub:'Toasted bun'},
  mochi:{label:'Mochi',sub:'Matte and powdery'},
  jelly:{label:'Clear jelly',sub:'See the inside'}
};
const COLORS=[['Butter','#F3DC8C'],['Milk','#F4EFE6'],['Peach','#FFB38A'],['Strawberry','#FF8FA8'],['Matcha','#A7C77A'],['Taro','#B8A2E3'],['Soda','#8EC9F0'],['Choco','#8B5E3C']];

let S={fill:'soft',skin:'tape',color:'#F3DC8C',count:0,sound:true};
let shelf=[];
try{const s=JSON.parse(localStorage.getItem('malang-day8'));if(s){S=Object.assign(S,s.cur||{});shelf=s.shelf||[]}}catch(e){}
const save=()=>{try{localStorage.setItem('malang-day8',JSON.stringify({cur:S,shelf}))}catch(e){}};

/* ---------- color helpers ---------- */
function hexRgb(h){h=h.replace('#','');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
const rgb=(a,al)=>'rgba('+a.map(Math.round).join(',')+','+(al==null?1:al)+')';
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const lighten=(c,t)=>mix(c,[255,255,255],t),darken=(c,t)=>mix(c,[0,0,0],t);
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}

/* precomputed random textures in unit space */
const R1=rng(7),TEX={
  crinkle:[...Array(11)].map(()=>{const x=R1()*1.4-.7,y=R1()*1.4-.7,a=R1()*Math.PI,l=.3+R1()*.45;return[[x,y],[x+Math.cos(a)*l*.5+(R1()-.5)*.1,y+Math.sin(a)*l*.5+(R1()-.5)*.1],[x+Math.cos(a)*l,y+Math.sin(a)*l]]}),
  lumps:[...Array(9)].map(()=>{const a=R1()*Math.PI*2,r=Math.sqrt(R1())*.75;return[Math.cos(a)*r,Math.sin(a)*r,.08+R1()*.1,R1()*Math.PI]}),
  dots:[...Array(260)].map(()=>{const a=R1()*Math.PI*2,r=Math.sqrt(R1());return[Math.cos(a)*r,Math.sin(a)*r,R1()]}),
  beads:[...Array(60)].map(()=>{const a=R1()*Math.PI*2,r=Math.sqrt(R1())*.92;return[Math.cos(a)*r,Math.sin(a)*r,.05+R1()*.06,R1()]})
};

/* ---------- drawing ---------- */
function smoothPath(c,pts){
  c.beginPath();const n=pts.length;
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let m=mid(pts[n-1],pts[0]);c.moveTo(m[0],m[1]);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],mm=mid(p,q);c.quadraticCurveTo(p[0],p[1],mm[0],mm[1])}
  c.closePath();
}
function fillTexture(c,fill,base,cx,cy,r){
  if(fill==='crunchy'){for(const b of TEX.beads){const col=b[3]<.33?lighten(base,.7):b[3]<.66?[255,255,255]:mix(base,[255,200,220],.5);c.fillStyle=rgb(col,.9);c.beginPath();c.arc(cx+b[0]*r,cy+b[1]*r,b[2]*r,0,7);c.fill();c.strokeStyle=rgb(darken(base,.3),.35);c.lineWidth=1;c.stroke()}}
  else if(fill==='soft'){for(const d of TEX.dots.slice(0,90)){c.fillStyle=rgb(lighten(base,.5),.55);c.beginPath();c.arc(cx+d[0]*r,cy+d[1]*r,1+d[2]*r*.05,0,7);c.fill()}}
  else if(fill==='watery'){c.strokeStyle=rgb([255,255,255],.55);c.lineWidth=Math.max(1,r*.03);for(let k=-2;k<=2;k++){c.beginPath();for(let x=-1;x<=1.01;x+=.1){const y=k*.3+Math.sin(x*6+k)*.06;x===-1?c.moveTo(cx+x*r,cy+y*r):c.lineTo(cx+x*r,cy+y*r)}c.stroke()}for(const b of TEX.beads.slice(0,14)){c.beginPath();c.arc(cx+b[0]*r,cy+b[1]*r,b[2]*r*.7,0,7);c.stroke()}}
  else if(fill==='sherbet'){const pal=[[255,255,255],lighten(base,.6),[255,182,193],[173,216,230],[255,236,150]];for(const d of TEX.dots){c.fillStyle=rgb(pal[Math.floor(d[2]*pal.length)],.85);c.fillRect(cx+d[0]*r,cy+d[1]*r,Math.max(1.2,r*.025),Math.max(1.2,r*.025))}}
  else{c.strokeStyle=rgb(lighten(base,.35),.6);c.lineWidth=Math.max(1,r*.05);c.beginPath();for(let t=0;t<12;t+=.1){const rr=r*t/14;const x=cx+Math.cos(t)*rr,y=cy+Math.sin(t)*rr;t===0?c.moveTo(x,y):c.lineTo(x,y)}c.stroke()}
}
// draws the squishy; st holds the live shape (points, dent) or null for a still picture
function drawSquishy(c,o,st){
  const{cx,cy,R,fill,skin}=o,base=hexRgb(o.color),N=st?st.n:48;
  const sq=st?st.sq:0;
  const pts=[];
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=R+(st?st.d[i]:0);pts.push([cx+Math.cos(a)*r*(1+sq),cy+Math.sin(a)*r*(1-sq)+R*sq])}
  // shadow on the table
  const sy=cy+R+R*.02,sg=c.createRadialGradient(cx,sy,0,cx,sy,R*(1.05+sq));sg.addColorStop(0,'rgba(40,30,20,.28)');sg.addColorStop(1,'rgba(40,30,20,0)');
  c.save();c.translate(cx,sy);c.scale(1,.16);c.translate(-cx,-sy);c.fillStyle=sg;c.beginPath();c.arc(cx,sy,R*(1.05+sq),0,7);c.fill();c.restore();
  smoothPath(c,pts);
  c.save();c.clip();
  const hx=cx-R*.35,hy=cy-R*.42;
  // base fill
  if(skin==='hotteok'){
    const cream=mix(lighten(base,.45),[245,228,200],.5),toast=mix(base,[200,80,26],.7);
    const g=c.createRadialGradient(cx,cy-R*.05,0,cx,cy,R*1.02);g.addColorStop(0,rgb(darken(toast,.08)));g.addColorStop(.35,rgb(toast));g.addColorStop(.7,rgb(mix(toast,cream,.7)));g.addColorStop(.86,rgb(cream));g.addColorStop(1,rgb(darken(cream,.08)));
    c.fillStyle=g;c.fillRect(cx-R*2,cy-R*2,R*4,R*4);
    for(const d of TEX.dots.slice(0,140)){c.fillStyle=rgb(darken(toast,.4),.12);c.beginPath();c.arc(cx+d[0]*R*.75,cy+d[1]*R*.75,.6+d[2]*1.4,0,7);c.fill()}
  }else if(skin==='jelly'){
    const g=c.createRadialGradient(hx,hy,R*.1,cx,cy,R*1.2);g.addColorStop(0,rgb(lighten(base,.55),.75));g.addColorStop(.6,rgb(base,.6));g.addColorStop(1,rgb(darken(base,.2),.75));
    c.fillStyle=g;c.fillRect(cx-R*2,cy-R*2,R*4,R*4);
    c.save();c.beginPath();c.arc(cx,cy+R*sq*.5,R*.62,0,7);c.clip();c.globalAlpha=1;fillTexture(c,fill,base,cx,cy,R*.62);c.restore();
  }else{
    const matte=skin==='mochi';
    const g=c.createRadialGradient(hx,hy,R*.08,cx,cy,R*1.25);g.addColorStop(0,rgb(lighten(base,matte?.35:.5)));g.addColorStop(.5,rgb(base));g.addColorStop(1,rgb(darken(base,matte?.12:.25)));
    c.fillStyle=g;c.fillRect(cx-R*2,cy-R*2,R*4,R*4);
  }
  if(skin==='tape'){ // the lumpy dents you see on taped squishies
    for(const l of TEX.lumps){const x=cx+l[0]*R,y=cy+l[1]*R,r=l[2]*R;const g=c.createRadialGradient(x+r*.3,y+r*.35,0,x,y,r);g.addColorStop(0,rgb(darken(base,.18),.45));g.addColorStop(.7,rgb(darken(base,.08),.15));g.addColorStop(1,rgb(base,0));c.fillStyle=g;c.beginPath();c.ellipse(x,y,r*1.2,r,l[3],0,7);c.fill();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=Math.max(1,R*.012);c.beginPath();c.ellipse(x,y,r*1.15,r*.95,l[3],Math.PI*1.05,Math.PI*1.6);c.stroke()}
  }
  // the dent where you press, and what happens inside
  if(st){
    if(st.dent>.01){const dr=R*.42,g=c.createRadialGradient(st.dx,st.dy,0,st.dx,st.dy,dr);g.addColorStop(0,rgb(darken(base,.35),.32*st.dent));g.addColorStop(.6,rgb(darken(base,.18),.18*st.dent));g.addColorStop(1,rgb(base,0));c.fillStyle=g;c.beginPath();c.arc(st.dx,st.dy,dr,0,7);c.fill();
      c.strokeStyle='rgba(255,255,255,'+(.5*st.dent)+')';c.lineWidth=Math.max(1.5,R*.02);c.beginPath();c.arc(st.dx,st.dy,dr*.62,Math.PI*1.1,Math.PI*1.75);c.stroke()}
    for(const k of st.cracks){c.strokeStyle=rgb(darken(base,.4),.55*k.life);c.lineWidth=1.4;c.beginPath();k.p.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}
    for(const g of st.grains){c.fillStyle=rgb(g.c,g.life);c.fillRect(g.x,g.y,2.2,2.2)}
    for(const w of st.ripples){c.strokeStyle='rgba(255,255,255,'+(.6*w.life)+')';c.lineWidth=2;c.beginPath();c.ellipse(w.x,w.y,w.r,w.r*.8,0,0,7);c.stroke()}
  }
  // surface finish
  if(skin==='mochi'){for(const d of TEX.dots){c.fillStyle='rgba(255,255,255,'+(.18+d[2]*.25)+')';c.beginPath();c.arc(cx+d[0]*R,cy+d[1]*R,.7+d[2]*1.1,0,7);c.fill()}}
  if(skin==='tape'){
    c.lineCap='round';
    for(const cr of TEX.crinkle){const p=cr.map(q=>[cx+q[0]*R,cy+q[1]*R]);c.strokeStyle='rgba(255,255,255,.13)';c.lineWidth=Math.max(4,R*.09);c.beginPath();c.moveTo(p[0][0],p[0][1]);c.quadraticCurveTo(p[1][0],p[1][1],p[2][0],p[2][1]);c.stroke();c.strokeStyle='rgba(255,255,255,.42)';c.lineWidth=Math.max(.8,R*.01);c.stroke()}
  }
  if(skin!=='mochi'){
    const s=skin==='hotteok'?.35:skin==='jelly'?.85:.7;
    const g=c.createRadialGradient(hx,hy,0,hx,hy,R*.32);g.addColorStop(0,'rgba(255,255,255,'+s+')');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.save();c.translate(hx,hy);c.rotate(-.6);c.scale(1.5,.8);c.beginPath();c.arc(0,0,R*.32,0,7);c.restore();c.fill();
    c.fillStyle='rgba(255,255,255,'+(s*.9)+')';c.beginPath();c.ellipse(hx-R*.05,hy-R*.02,R*.06,R*.035,-.6,0,7);c.fill();
  }else{const g=c.createRadialGradient(hx,hy,0,hx,hy,R*.5);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(cx-R,cy-R,R*2,R*2)}
  c.restore();
  // rim
  smoothPath(c,pts);
  if(skin==='tape'||skin==='jelly'){c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=Math.max(1,R*.012);c.stroke()}
  else{c.strokeStyle=rgb(darken(base,.3),.25);c.lineWidth=1;c.stroke()}
  if(skin==='tape'){ // loose end of the wrap
    c.fillStyle='rgba(255,255,255,.22)';c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;c.beginPath();
    const ex=cx+R*.55,ey=cy-R*.75+R*sq;c.moveTo(ex,ey);c.lineTo(ex+R*.42,ey-R*.22);c.lineTo(ex+R*.5,ey+R*.06);c.lineTo(ex+R*.18,ey+R*.2);c.closePath();c.fill();c.stroke();
  }
}

/* ---------- the stage ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,R=0,cx=0,cy=0;
const N=72,st={n:N,d:new Float32Array(N),v:new Float32Array(N),sq:0,sqv:0,dent:0,dentv:0,dx:0,dy:0,cracks:[],grains:[],ripples:[]};
function resize(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.width;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  R=W*.3;cx=W/2;cy=H*.72-R;st.dx=cx;st.dy=cy;
}
new ResizeObserver(resize).observe(cv);
let down=false,press=0,px=0,py=0,lastMove=0,lastFx=0,speed=0;
function local(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)]}
cv.addEventListener('pointerdown',e=>{
  const[x,y]=local(e);if(Math.hypot(x-cx,y-cy)>R*1.15)return;
  e.preventDefault();cv.setPointerCapture(e.pointerId);down=true;cv.classList.add('down');px=x;py=y;press=0;
  S.count++;$('count').textContent=S.count+(S.count===1?' squish':' squishes');$('hint').style.opacity=0;
  audioOn();sound('press');save();
});
cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=local(e);speed=Math.hypot(x-px,y-py);px=x;py=y;lastMove=performance.now()});
const up=()=>{if(!down)return;down=false;cv.classList.remove('down');sound('release')};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!down){px=cx;py=cy;down=true;press=0;S.count++;$('count').textContent=S.count+' squishes';audioOn();sound('press');setTimeout(up,600)}}});
cv.tabIndex=0;

let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last)/1000;last=now;
  const F=FILLS[S.fill];
  if(down)press=Math.min(1,press+dt*F.rate);
  // targets for the outline
  const tgt=new Float32Array(N);
  if(down){
    const depth=F.depth*R*press,rho=R*F.spread;let inSum=0;
    for(let i=0;i<N;i++){const a=i/N*Math.PI*2,rx=cx+Math.cos(a)*R,ry=cy+Math.sin(a)*R,dist=Math.hypot(px-rx,py-ry);if(dist<rho){const f=1-dist/rho;tgt[i]=-depth*f*f;inSum+=depth*f*f}}
    const out=inSum/N*.9;for(let i=0;i<N;i++)if(tgt[i]===0)tgt[i]=out;
  }
  const steps=Math.max(1,Math.round(dt*60));
  for(let s=0;s<steps;s++){
    for(let i=0;i<N;i++){st.v[i]+=(tgt[i]-st.d[i])*F.k;st.v[i]*=F.damp;st.d[i]+=st.v[i]}
    const dT=down?press*F.dent:0;st.dentv+=(dT-st.dent)*F.k;st.dentv*=F.damp;st.dent+=st.dentv;
    const sT=down?press*F.squash:0;st.sqv+=(sT-st.sq)*F.k*1.4;st.sqv*=F.damp;st.sq+=st.sqv;
  }
  if(down){st.dx+=(px-st.dx)*.35;st.dy+=(py-st.dy)*.35}
  // what the inside does
  const moving=down&&now-lastMove<120;
  if(down&&now-lastFx>(moving?70:260)){
    lastFx=now;
    if(S.fill==='crunchy'){const p=[[st.dx,st.dy]];let x=st.dx,y=st.dy;for(let k=0;k<3;k++){x+=(Math.random()-.5)*R*.22;y+=(Math.random()-.5)*R*.22;p.push([x,y])}st.cracks.push({p,life:1});sound('crunch')}
    if(S.fill==='watery'){st.ripples.push({x:st.dx,y:st.dy,r:4,life:1});if(moving)sound('slosh')}
    if(S.fill==='sherbet'){const base=hexRgb(S.color),pal=[[255,255,255],lighten(base,.6),[255,182,193],[173,216,230]];for(let k=0;k<10;k++){const a=Math.random()*7,r=Math.random()*R*.3;st.grains.push({x:st.dx+Math.cos(a)*r,y:st.dy+Math.sin(a)*r,c:pal[k%4],life:1})}if(moving)sound('sand')}
    if(S.fill==='dough'&&moving)sound('creak');
    if(S.fill==='soft'&&moving&&Math.random()<.3)sound('squeak');
  }
  st.cracks=st.cracks.filter(k=>(k.life-=dt*1.6)>0);
  st.grains=st.grains.filter(g=>(g.life-=dt*1.2)>0);
  st.ripples=st.ripples.filter(w=>{w.r+=dt*R*.9;return(w.life-=dt*1.5)>0});
  ctx.clearRect(0,0,W,H);
  drawSquishy(ctx,{cx,cy,R,fill:S.fill,skin:S.skin,color:S.color},st);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- sounds, made right in the browser ---------- */
let ac=null,noise=null;
function audioOn(){
  if(!S.sound)return;
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function burst(t,{freq=2000,q=1,gain=.2,dur=.04,type='bandpass'}){
  const s=ac.createBufferSource();s.buffer=noise;s.loop=true;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random());s.stop(t+dur+.02);
}
function tone(t,{from=300,to=120,gain=.15,dur=.18,type='sine',lp=1200}){
  const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(to,t+dur);
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function sound(kind){
  if(!S.sound||!ac)return;const t=ac.currentTime,f=S.fill;
  if(kind==='crunch'){const n=2+Math.floor(Math.random()*4);for(let i=0;i<n;i++)burst(t+i*(.012+Math.random()*.03),{freq:1500+Math.random()*3500,q:1.5,gain:.22,dur:.03+Math.random()*.03});if(navigator.vibrate)navigator.vibrate(8);return}
  if(kind==='sand'){burst(t,{freq:5500,q:.7,gain:.06,dur:.12,type:'highpass'});return}
  if(kind==='slosh'){tone(t,{from:260+Math.random()*80,to:110,gain:.08,dur:.16});return}
  if(kind==='creak'){tone(t,{from:70,to:55,gain:.06,dur:.14,type:'sawtooth',lp:350});return}
  if(kind==='squeak'){burst(t,{freq:600,q:3,gain:.05,dur:.08});return}
  if(kind==='press'){
    if(f==='crunchy')sound('crunch');
    else if(f==='watery')tone(t,{from:320,to:120,gain:.18,dur:.2});
    else if(f==='sherbet')burst(t,{freq:4500,q:.6,gain:.1,dur:.2,type:'highpass'});
    else if(f==='dough')tone(t,{from:90,to:60,gain:.1,dur:.22,type:'sawtooth',lp:300});
    else burst(t,{freq:180,q:.8,gain:.25,dur:.12,type:'lowpass'});
  }
  if(kind==='release'){
    if(f==='watery')tone(t,{from:140,to:420,gain:.12,dur:.18});
    else if(f==='crunchy')burst(t,{freq:2500,q:1.5,gain:.1,dur:.03});
    else if(f==='soft')burst(t,{freq:300,q:.8,gain:.06,dur:.3,type:'lowpass'});
  }
}
$('sound').onclick=()=>{S.sound=!S.sound;$('sound').setAttribute('aria-pressed',S.sound);$('sound').textContent=S.sound?'Sound on':'Sound off';save();if(S.sound)audioOn()};

/* ---------- pickers ---------- */
function mini(canvas,o){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=canvas.clientWidth||44;canvas.width=w*dpr;canvas.height=w*dpr;
  const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,w);drawSquishy(c,Object.assign({cx:w/2,cy:w*.46,R:w*.36},o),null);
}
function nameOf(o){const col=(COLORS.find(c=>c[1]===o.color)||['Custom'])[0];return col+' '+SKINS[o.skin].label.toLowerCase()+', '+FILLS[o.fill].label.toLowerCase()}
function paint(){
  $('fills').innerHTML=Object.entries(FILLS).map(([k,v])=>'<button type="button" class="opt" data-fill="'+k+'" aria-pressed="'+(S.fill===k)+'"><canvas></canvas><span><b>'+v.label+'</b><span>'+v.sub+'</span></span></button>').join('');
  $('skins').innerHTML=Object.entries(SKINS).map(([k,v])=>'<button type="button" class="opt" data-skin="'+k+'" aria-pressed="'+(S.skin===k)+'"><canvas></canvas><span><b>'+v.label+'</b><span>'+v.sub+'</span></span></button>').join('');
  $('colors').innerHTML=COLORS.map(c=>'<button type="button" class="sw" data-color="'+c[1]+'" aria-pressed="'+(S.color===c[1])+'" aria-label="'+c[0]+'" title="'+c[0]+'" style="background:'+c[1]+'"></button>').join('');
  document.querySelectorAll('#fills canvas').forEach((cn,i)=>{const k=Object.keys(FILLS)[i];mini(cn,{fill:k,skin:'jelly',color:S.color})});
  document.querySelectorAll('#skins canvas').forEach((cn,i)=>{const k=Object.keys(SKINS)[i];mini(cn,{fill:S.fill,skin:k,color:S.color})});
  $('name').textContent=nameOf(S);
  $('count').textContent=S.count?S.count+(S.count===1?' squish':' squishes'):'';
  $('sound').setAttribute('aria-pressed',S.sound);$('sound').textContent=S.sound?'Sound on':'Sound off';
}
document.querySelector('.main').addEventListener('click',e=>{
  const b=e.target.closest('[data-fill],[data-skin],[data-color]');if(!b)return;
  if(b.dataset.fill&&b.dataset.fill!==S.fill){st.d.fill(0);st.v.fill(0);st.sq=0;st.sqv=0;st.dent=0;st.dentv=0}
  if(b.dataset.fill)S.fill=b.dataset.fill;if(b.dataset.skin)S.skin=b.dataset.skin;if(b.dataset.color)S.color=b.dataset.color;
  save();paint();
});

/* ---------- shelf ---------- */
function paintShelf(){
  $('shelf').innerHTML=shelf.length?shelf.map((o,i)=>'<button type="button" data-i="'+i+'" aria-label="Load '+esc(nameOf(o))+'"><canvas></canvas><small>'+esc(nameOf(o))+'</small><span class="rm" data-rm="'+i+'" role="button" aria-label="Remove">×</span></button>').join(''):'<p class="empty">Make one you like and tap “Keep it” to put it here.</p>';
  document.querySelectorAll('#shelf canvas').forEach((cn,i)=>mini(cn,shelf[i]));
}
$('keep').onclick=()=>{const o={fill:S.fill,skin:S.skin,color:S.color};if(!shelf.some(x=>x.fill===o.fill&&x.skin===o.skin&&x.color===o.color)){shelf.unshift(o);shelf=shelf.slice(0,24);save();paintShelf()}$('keep').textContent='On your shelf';setTimeout(()=>$('keep').textContent='Keep it',1400)};
$('shelf').onclick=e=>{
  const rm=e.target.closest('[data-rm]');if(rm){e.stopPropagation();shelf.splice(+rm.dataset.rm,1);save();paintShelf();return}
  const b=e.target.closest('[data-i]');if(!b)return;Object.assign(S,shelf[+b.dataset.i]);save();paint();window.scrollTo({top:0,behavior:'smooth'});
};

paint();paintShelf();
window.addEventListener('resize',()=>{paint();paintShelf()});
function connect(){if(!(window.claude&&typeof window.claude.use==='function'))return false;$('back').href='https://claude.ai/artifact/8XtxNzRVg4mMWQh9EwK3sc';return true}
if(!connect())window.addEventListener('load',()=>{if(!connect())setTimeout(connect,1500)});
})();
</script>
