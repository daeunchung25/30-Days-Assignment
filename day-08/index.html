
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 08 — Squishy Lab</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f8f7f4;
  color: #282724;
  font-family: Arial, sans-serif;
}
header {
  padding: 24px 32px;
  border-bottom: 1px solid #e7e4df;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-weight: 800; font-size: 20px; }
.day { color: #999; font-size: 12px; }
main {
  display: grid;
  grid-template-columns: 1fr 320px;
  min-height: calc(100vh - 77px);
}
.stage {
  position: relative;
  min-height: 600px;
  background: radial-gradient(
    ellipse at 50% 42%,
    #ffffff 0%, #f4f1eb 80%
  );
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}
.stage:active { cursor: grabbing; }
#scene { width: 100%; height: 100%; display: block; }
.hint {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: #aaa;
  pointer-events: none;
  white-space: nowrap;
}
.tag {
  position: absolute;
  top: 28px;
  left: 30px;
  font-size: 11px;
  color: #aaa;
  letter-spacing: 2px;
}
aside {
  background: white;
  padding: 30px;
  border-left: 1px solid #eae7e2;
  overflow-y: auto;
}
h1 { font-size: 25px; margin: 0 0 8px; }
.subtitle {
  color: #999;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 32px;
}
section { margin-bottom: 28px; }
.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin-bottom: 13px;
  text-transform: uppercase;
}
.options { display: grid; gap: 8px; }
.option {
  background: #faf9f7;
  border: 1px solid #eae8e4;
  padding: 13px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  color: #555;
}
.option:hover { background: #f2efeb; }
.option.active {
  border-color: #262522;
  background: #f2f0ec;
  color: #222;
}
.shape-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.shape-options .option { text-align: center; }
.emoji { display: block; font-size: 26px; margin-bottom: 7px; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.color {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 3px solid white;
  outline: 1px solid #ddd;
  cursor: pointer;
}
.color.active { outline: 2px solid #333; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
input[type=range] { width: 100%; accent-color: #777; }
.reset {
  width: 100%;
  padding: 14px;
  background: #292824;
  color: white;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
@media(max-width: 750px) {
  main { grid-template-columns: 1fr; }
  .stage { min-height: 430px; height: 55vh; }
  aside { border-left: 0; }
}
</style>
</head>
<body>
<header>
  <div class="logo">squishy lab<span style="color:#ed9c96">.</span></div>
  <div class="day">DAY 08 / INTERACTIVE EXPERIMENT</div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="tag">YOUR LITTLE STRESS RELIEVER</div>
    <canvas id="scene"></canvas>
    <div class="hint">PRESS + DRAG TO SQUISH · RELEASE TO WATCH IT RISE</div>
  </div>

  <aside>
    <h1>Make it squishy.</h1>
    <p class="subtitle">Build your perfect squishy, then give it a squeeze.</p>

    <section>
      <div class="section-title">01 / Shape</div>
      <div class="shape-options">
        <button class="option active" data-shape="peach">
          <span class="emoji">🍑</span>Peach
        </button>
        <button class="option" data-shape="bread">
          <span class="emoji">🍞</span>Mochi
        </button>
        <button class="option" data-shape="mallow">
          <span class="emoji">☁️</span>Mallow
        </button>
      </div>
    </section>

    <section>
      <div class="section-title">02 / Inner Filling</div>
      <div class="options">
        <button class="option active" data-fill="soft">Soft — slow rising foam</button>
        <button class="option" data-fill="crunchy">Crunchy — tiny crackling beads</button>
        <button class="option" data-fill="watery">Watery — liquid filled</button>
        <button class="option" data-fill="sherbet">Sherbet — slushy and grainy</button>
        <button class="option" data-fill="firm">Firm — dense and stretchy</button>
      </div>
    </section>

    <section>
      <div class="section-title">03 / Outer Skin</div>
      <div class="options">
        <button class="option active" data-skin="matte">Matte & soft</button>
        <button class="option" data-skin="glossy">Glossy silicone</button>
        <button class="option" data-skin="clear">Translucent jelly</button>
        <button class="option" data-skin="thick">Thick rubber</button>
      </div>
    </section>

    <section>
      <div class="section-title">04 / Color</div>
      <div class="colors">
        <button class="color active" data-color="#f3b5a4" style="background:#f3b5a4"></button>
        <button class="color" data-color="#f5d86f" style="background:#f5d86f"></button>
        <button class="color" data-color="#d3e7bb" style="background:#d3e7bb"></button>
        <button class="color" data-color="#c8c5ed" style="background:#c8c5ed"></button>
        <button class="color" data-color="#e8c4db" style="background:#e8c4db"></button>
        <button class="color" data-color="#f5eee1" style="background:#f5eee1"></button>
      </div>
    </section>

    <section>
      <div class="row">
        <div class="section-title">05 / Squish Strength</div>
        <span id="strengthLabel">70%</span>
      </div>
      <input type="range" id="strength" min="20" max="100" value="70">
    </section>

    <section>
      <div class="row">
        <span>Squishy sounds</span>
        <input type="checkbox" id="sound" checked>
      </div>
    </section>

    <button class="reset" id="reset">Reset my squishy ↗</button>
  </aside>
</main>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const canvas = document.getElementById("scene");
const stage = document.getElementById("stage");

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0.25, 8);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c9bd, 2.4));

const light = new THREE.DirectionalLight(0xffffff, 3.2);
light.position.set(-3, 5, 7);
scene.add(light);

const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
fillLight.position.set(4, -1, 4);
scene.add(fillLight);

const group = new THREE.Group();
scene.add(group);

let shape = "peach";
let filling = "soft";
let skin = "matte";
let color = "#f3b5a4";
let strength = 0.7;

let mesh, basePositions;
let pressing = false;
let pressure = 0;
let targetPressure = 0;
let pressPoint = new THREE.Vector3(0, 0, 1);
let localPoint = new THREE.Vector3(0, 0, 1);
let pressNormal = new THREE.Vector3(0, 0, 1);
let audioContext;

const settings = {
  soft: { depth: 0.75, recovery: 0.035, radius: 0.9 },
  crunchy: { depth: 0.48, recovery: 0.09, radius: 0.65 },
  watery: { depth: 0.95, recovery: 0.16, radius: 1.1 },
  sherbet: { depth: 0.65, recovery: 0.06, radius: 0.75 },
  firm: { depth: 0.38, recovery: 0.12, radius: 0.75 }
};

function createGeometry() {
  let geometry = new THREE.SphereGeometry(1.55, 96, 72);
  const p = geometry.attributes.position;
  const v = new THREE.Vector3();

  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const x = v.x, y = v.y, z = v.z;

    if (shape === "peach") {
      const top = Math.max(0, y / 1.55);
      const groove = Math.exp(-Math.pow(x / 0.24, 2)) * top * 0.14;
      v.y *= 0.94;
      v.y -= groove;
      v.x *= 1 + 0.035 * Math.sin(y * 2);
      v.z *= 0.91;
      if (y < -0.7) v.y += 0.09;
    }

    if (shape === "bread") {
      v.y *= 0.78;
      v.z *= 0.78;
      const top = Math.max(0, v.y);
      v.y += 0.12 * Math.exp(-x*x*1.5) * top;
    }

    if (shape === "mallow") {
      const k = 0.55;
      const r = Math.sqrt(x*x + z*z);
      const rounded = Math.pow(Math.abs(x/1.55), 4)
        + Math.pow(Math.abs(y/1.55), 4)
        + Math.pow(Math.abs(z/1.55), 4);
      const factor = Math.pow(Math.max(rounded, 0.001), -0.08);
      v.multiplyScalar(Math.min(factor, 1.22));
      v.y *= 0.83;
      v.z *= 0.85;
    }
    p.setXYZ(i, v.x, v.y, v.z);
  }

  geometry.computeVertexNormals();
  return geometry;
}

function createSquishy() {
  if (mesh) {
    group.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
  }

  const geometry = createGeometry();
  basePositions = new Float32Array(geometry.attributes.position.array);

  const material = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color),
    roughness: skin === "matte" ? 0.55 :
               skin === "glossy" ? 0.13 :
               skin === "clear" ? 0.18 : 0.4,
    metalness: 0,
    clearcoat: skin === "glossy" ? 1 : 0.15,
    clearcoatRoughness: 0.12,
    transmission: skin === "clear" ? 0.24 : 0,
    thickness: skin === "clear" ? 1.5 : 0,
    transparent: skin === "clear",
    opacity: 1
  });

  mesh = new THREE.Mesh(geometry, material);
  group.add(mesh);
  pressure = 0;
  targetPressure = 0;
  pressPoint.set(0, 0, 1.55);
  localPoint.copy(pressPoint);
  pressNormal.set(0, 0, 1);
}

function deform() {
  if (!mesh) return;
  const geometry = mesh.geometry;
  const pos = geometry.attributes.position;
  const cfg = settings[filling];

  const recovery = pressing ? 0.22 : cfg.recovery;
  pressure += (targetPressure - pressure) * recovery;
  if (Math.abs(pressure) < 0.0001) pressure = 0;

  const radius = cfg.radius * (skin === "thick" ? 1.15 : 1);
  const depth = cfg.depth * strength *
    (skin === "thick" ? 0.65 : 1) * pressure;

  const center = localPoint;
  const normal = pressNormal;

  for (let i = 0; i < pos.count; i++) {
    const j = i * 3;
    const x = basePositions[j];
    const y = basePositions[j+1];
    const z = basePositions[j+2];

    const dx = x - center.x;
    const dy = y - center.y;
    const dz = z - center.z;
    const d2 = dx*dx + dy*dy + dz*dz;

    const influence = Math.exp(-d2 / (radius*radius));
    const ring = Math.exp(
      -Math.pow(Math.sqrt(d2) - radius*0.9, 2) / 0.12
    );

    const dent = depth * influence;
    const bulge = depth * 0.16 * ring;

    const length = Math.sqrt(x*x+y*y+z*z) || 1;
    const nx = x/length, ny = y/length, nz = z/length;

    let wobble = 0;
    if (filling === "watery" && pressure > 0.01) {
      wobble = Math.sin(performance.now()*0.009 + x*5 + y*4)
        * pressure * 0.035;
    }
    if (filling === "sherbet" && pressure > 0.01) {
      wobble = Math.sin(x*19+y*17+z*13)
        * pressure * 0.012;
    }

    pos.setXYZ(i,
      x - normal.x*dent + nx*(bulge+wobble),
      y - normal.y*dent + ny*(bulge+wobble),
      z - normal.z*dent + nz*(bulge+wobble)
    );
  }
  pos.needsUpdate = true;
  geometry.computeVertexNormals();
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function updatePointer(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(mesh);

  if (hits.length) {
    localPoint.copy(hits[0].point);
    mesh.worldToLocal(localPoint);
    pressNormal.copy(localPoint).normalize();
    return true;
  }
  return false;
}

canvas.addEventListener("pointerdown", e => {
  if (updatePointer(e)) {
    pressing = true;
    targetPressure = 1;
    canvas.setPointerCapture(e.pointerId);
    playSquish();
  }
});

canvas.addEventListener("pointermove", e => {
  if (pressing) {
    const rect = canvas.getBoundingClientRect();
    const moveX = (e.clientX-rect.left)/rect.width*2-1;
    const moveY = -((e.clientY-rect.top)/rect.height*2-1);
    const projected = new THREE.Vector3(moveX, moveY, 0.5)
      .unproject(camera);
    const direction = projected.sub(camera.position).normalize();
    const distance = (localPoint.z-camera.position.z)/direction.z;
    const point = camera.position.clone()
      .add(direction.multiplyScalar(distance));

    localPoint.lerp(point, 0.18);
    targetPressure = Math.min(1.2,
      0.75 + Math.abs(e.movementY)*0.012);
  }
});

function release() {
  pressing = false;
  targetPressure = 0;
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
window.addEventListener("pointerup", release);

function playSquish() {
  if (!document.getElementById("sound").checked) return;
  try {
    audioContext ||= new (window.AudioContext ||
      window.webkitAudioContext)();

    if (audioContext.state === "suspended") audioContext.resume();

    const now = audioContext.currentTime;
    const duration = 0.22;
    const count = Math.floor(audioContext.sampleRate*duration);
    const buffer = audioContext.createBuffer(
      1, count, audioContext.sampleRate
    );
    const data = buffer.getChannelData(0);

    for (let i=0; i<count; i++) {
      const t = i/count;
      const envelope = Math.sin(Math.PI*t);
      const noise = Math.random()*2-1;

      if (filling === "crunchy" || filling === "sherbet") {
        data[i] = noise * envelope *
          (Math.random() > 0.8 ? 0.5 : 0.08);
      } else if (filling === "watery") {
        data[i] = (Math.sin(i*0.013) + noise*0.3)
          * envelope*0.3;
      } else {
        data[i] = (Math.sin(i*(filling==="firm" ? 0.045 : 0.02))
          + noise*0.12)*envelope*0.25;
      }
    }

    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value =
      filling === "crunchy" ? 3200 : 850;

    source.buffer = buffer;
    gain.gain.value = 0.35;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);
    source.start(now);
  } catch(err) {
    console.log("Audio unavailable", err);
  }
}

function setActive(attribute, value) {
  document.querySelectorAll(`[data-${attribute}]`).forEach(el => {
    el.classList.toggle("active",
      el.dataset[attribute] === value);
  });
}

document.querySelectorAll("[data-shape]").forEach(el => {
  el.addEventListener("click", () => {
    shape = el.dataset.shape;
    setActive("shape", shape);
    createSquishy();
  });
});
document.querySelectorAll("[data-fill]").forEach(el => {
  el.addEventListener("click", () => {
    filling = el.dataset.fill;
    setActive("fill", filling);
  });
});
document.querySelectorAll("[data-skin]").forEach(el => {
  el.addEventListener("click", () => {
    skin = el.dataset.skin;
    setActive("skin", skin);
    createSquishy();
  });
});
document.querySelectorAll("[data-color]").forEach(el => {
  el.addEventListener("click", () => {
    color = el.dataset.color;
    setActive("color", color);
    mesh.material.color.set(color);
  });
});

document.getElementById("strength").addEventListener("input", e => {
  strength = e.target.value/100;
  document.getElementById("strengthLabel").textContent =
    e.target.value+"%";
});

document.getElementById("reset").addEventListener("click", () => {
  shape = "peach";
  filling = "soft";
  skin = "matte";
  color = "#f3b5a4";
  strength = 0.7;
  setActive("shape", shape);
  setActive("fill", filling);
  setActive("skin", skin);
  setActive("color", color);
  document.getElementById("strength").value = 70;
  document.getElementById("strengthLabel").textContent = "70%";
  createSquishy();
});

function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

createSquishy();
resize();

function animate() {
  requestAnimationFrame(animate);
  deform();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
