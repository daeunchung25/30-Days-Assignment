<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Squish | Day 8 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EEECEA;--paper:#FFFFFF;--ink:#26222C;--muted:#6F6A76;--line:#DCD9DE;--accent:#FF6F91;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161518;--paper:#211F24;--ink:#EEEBF2;--muted:#A39DAB;--line:#34313A;--accent:#FF86A4;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#161518;--paper:#211F24;--ink:#EEEBF2;--muted:#A39DAB;--line:#34313A;--accent:#FF86A4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.round{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 70px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.top a{color:var(--muted);font-size:14px;text-decoration:none}
.top a:hover{text-decoration:underline}
.top h1{font-size:22px;margin:0}

.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding-top:24px;align-items:start}
.stagewrap{position:sticky;top:14px}
.stage{position:relative;border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(#F4F2F2 0%,#EDEAEA 34%,#FAF9F8 34.4%,#F1EEEC 100%)}
.stage canvas{display:block;width:100%;aspect-ratio:1;cursor:grab}
.stage canvas.down{cursor:grabbing}
.hint{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:15px;color:#7A746E;pointer-events:none;transition:opacity .4s}
.count{position:absolute;right:16px;bottom:12px;font-size:14px;color:#7A746E}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.name{font-size:20px}

.title{font-size:clamp(40px,7vw,64px);line-height:1;margin:0 0 8px}
.lede{margin:0 0 20px;color:var(--muted);max-width:44ch}
.group{margin-bottom:18px}
.group h2{font-size:19px;margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.picks{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.picks .opt{grid-template-columns:1fr;text-align:center;padding:8px}
.picks .opt canvas{width:100%;height:auto;aspect-ratio:1}
.opt{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:7px 10px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt canvas{width:46px;height:46px;border-radius:10px;background:#F1EEEC}
.opt b{display:block;font-size:15px;line-height:1.2}
.opt span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.vol{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.vol input{width:90px;accent-color:var(--accent)}
@media (max-width:820px){.main{grid-template-columns:1fr}.stagewrap{position:static}.title{display:none}}
</style>

<body>
<div class="wrap">
  <div class="top">
    <a id="back" href="../">Day 8 of 30</a>
    <h1 class="round">Squish</h1>
  </div>

  <div class="main">
    <div class="stagewrap">
      <div class="stage">
        <canvas id="cv" role="img" aria-label="Your squishy. Press and hold to squish it, drag to move the dent. Two fingers work too."></canvas>
        <div class="hint" id="hint">Press and hold. Drag to squish around.</div>
        <div class="count" id="count"></div>
      </div>
      <div class="stagebar">
        <span class="name round" id="name"></span>
        <label class="vol">Sound <input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Volume"></label>
      </div>
    </div>

    <div>
      <p class="title round">Squish</p>
      <p class="lede">Pick a squishy and squish it. Each one comes with its own filling, and you can swap what’s inside. Turn the sound up.</p>
      <div class="group"><h2 class="round">Squishies</h2><div class="opts picks" id="picks" role="group" aria-label="Squishy"></div></div>
      <div class="group"><h2 class="round">Inside</h2><div class="opts" id="fills" role="group" aria-label="Filling"></div></div>
    </div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

/* ---------- options ---------- */
// k: spring back speed, damp: how long it keeps moving, depth: how far it sinks, size: finger size, rate: how fast it gives, flow: how the dent spreads
const FILLS={
  soft:{label:'Soft',sub:'Slow-rise foam',k:.014,damp:.8,depth:.6,size:1,squash:.12,rate:3,flow:.12},
  dough:{label:'Dough',sub:'Thick and squelchy',k:.005,damp:.66,depth:.5,size:.85,squash:.08,rate:1.6,flow:.04},
  crunchy:{label:'Crunchy',sub:'Crackly beads',k:.08,damp:.78,depth:.36,size:.85,squash:.07,rate:5,flow:.05},
  watery:{label:'Watery',sub:'Wobbly and wet',k:.16,damp:.93,depth:.5,size:1,squash:.14,rate:7,flow:.25},
  sherbet:{label:'Sherbet',sub:'Sandy, icy grains',k:.035,damp:.78,depth:.48,size:.95,squash:.09,rate:3.5,flow:.06}
};
// ready-made squishies, each matched to a reference photo
// foot: the shape, mat: how it catches the light, snd: what the outside sounds like
const MAT={
  velvet:{amb:.46,kd:.58,wrap:.75,ks:0,shin:1,ks2:0,rim:0,sheen:.3,sss:.06},
  silk:{amb:.4,kd:.64,wrap:.5,ks:.14,shin:18,ks2:.05,rim:.08,sheen:.08,sss:.16},
  satin:{amb:.4,kd:.64,wrap:.45,ks:.28,shin:26,ks2:.08,rim:.12,sheen:.05,sss:.28},
  glossy:{amb:.42,kd:.66,wrap:.22,ks:1,shin:140,ks2:.2,rim:.28,sheen:0,sss:.08},
  sugar:{amb:.36,kd:.58,wrap:.45,ks:1.3,shin:220,ks2:.12,rim:.35,sheen:0,sss:.4},
  scales:{amb:.3,kd:.74,wrap:.2,ks:.9,shin:90,ks2:.18,rim:.22,sheen:0,sss:.05}
};
const PICKS={
  salttoast:{label:'Salt toast',foot:'square',mat:'velvet',fill:'soft',snd:'velvet',base:'#A9D6CC'},
  peach:{label:'White peach',foot:'peach',mat:'satin',fill:'watery',snd:'silk',base:'#F5A9AA'},
  honey:{label:'Honey bread',foot:'oval',mat:'velvet',fill:'soft',snd:'velvet',base:'#F7D54C'},
  jumbo:{label:'Jumbo morning bun',foot:'round',mat:'silk',fill:'soft',snd:'silk',base:'#F6DC8E'},
  crispy:{label:'Crispy morning bun',foot:'bun',mat:'silk',fill:'crunchy',snd:'crust',base:'#F0ECD8'},
  eggtoast:{label:'Egg toast',foot:'square',mat:'velvet',fill:'soft',snd:'velvet',base:'#F5C12E'},
  cheese:{label:'Chubby cheese',foot:'cube',mat:'glossy',fill:'crunchy',snd:'tape',base:'#F4E4A6'},
  pistachio:{label:'Pistachio',foot:'egg',mat:'glossy',fill:'dough',snd:'tape',base:'#F6F5F0'},
  tape:{label:'Glossy tape',foot:'round',mat:'glossy',fill:'dough',snd:'tape',base:'#F5F4F1'},
  sugar:{label:'Sugar crystal',foot:'bun',mat:'sugar',fill:'sherbet',snd:'sugar',base:'#4FB3D6'},
  choco:{label:'Choco snake',foot:'round',mat:'scales',fill:'dough',snd:'silk',base:'#6A4130'}
};
let S={pick:'salttoast',fill:'soft',count:0,vol:.8};
try{const s=JSON.parse(localStorage.getItem('squish-day8b'));if(s)S=Object.assign(S,s)}catch(e){}
if(!PICKS[S.pick])S.pick='salttoast';if(!FILLS[S.fill])S.fill=PICKS[S.pick].fill;
const save=()=>{try{localStorage.setItem('squish-day8b',JSON.stringify(S))}catch(e){}};

/* ---------- surface textures ---------- */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
const hexRgb=h=>{const n=parseInt(h.replace('#',''),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const TEXC={};
function valueNoise(G,cells,seed){const r=rng(seed),g=[],out=new Float32Array(G*G),C=cells+1;for(let i=0;i<C*C;i++)g.push(r());
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){const fx=x/G*cells,fy=y/G*cells,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);const a=g[iy*C+ix],b=g[iy*C+ix+1],c=g[(iy+1)*C+ix],d=g[(iy+1)*C+ix+1];const top=a+(b-a)*sx,bot=c+(d-c)*sx;out[y*G+x]=top+(bot-top)*sy}return out}
function blur(a,G,r){const o=new Float32Array(a.length);for(let y=0;y<G;y++)for(let x=0;x<G;x++){let s=0,n=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<G&&yy<G){s+=a[yy*G+xx];n++}}o[y*G+x]=s/n}a.set(o)}
function tex(G){
  if(TEXC[G])return TEXC[G];
  const t={lumps:valueNoise(G,5,3),fine:valueNoise(G,Math.round(G/2.2),5),mid:valueNoise(G,Math.round(G/8),7)};
  // tape: flat facets with creases between them, like tape wrapped around a ball
  t.creases=new Float32Array(G*G);{const r=rng(13),pts=[...Array(16)].map(()=>[r()*G,r()*G,(r()-.5)*.09,(r()-.5)*.09]);const w=G*.045;
    for(let y=0;y<G;y++)for(let x=0;x<G;x++){let d1=1e9,d2=1e9,k1=0;for(let k=0;k<pts.length;k++){const d=Math.hypot(x-pts[k][0],y-pts[k][1]);if(d<d1){d2=d1;d1=d;k1=k}else if(d<d2)d2=d}
      const p=pts[k1],tilt=(x-p[0])*p[2]+(y-p[1])*p[3],e=Math.max(0,1-(d2-d1)/w);t.creases[y*G+x]=tilt*1.4+e*e*(3-2*e)*.9}
    blur(t.creases,G,2);blur(t.creases,G,2)}
  // sugar crystals: lots of little faceted bumps
  t.crystal=new Float32Array(G*G);{const r=rng(31),n=Math.round(G*G/10);for(let k=0;k<n;k++){const cx=r()*G,cy=r()*G,rad=(1.4+r()*3)*G/200,h=.7+r()*1.6;for(let y=Math.max(0,cy-rad|0);y<Math.min(G,cy+rad+1);y++)for(let x=Math.max(0,cx-rad|0);x<Math.min(G,cx+rad+1);x++){const d=Math.max(Math.abs(x-cx),Math.abs(y-cy)*.8+Math.abs(x-cx)*.3)/rad;if(d<1){const i=y*G+x;t.crystal[i]=Math.max(t.crystal[i],h*(1-d))}}}}
  // snakeskin: rows of rounded scales
  t.scales=new Float32Array(G*G);{const sz=G/26;for(let y=0;y<G;y++)for(let x=0;x<G;x++){const row=Math.floor(y/(sz*.8)),off=row%2?sz/2:0,cx=Math.floor((x+off)/sz)*sz-off+sz/2,cy=row*sz*.8+sz*.4;let best=1e9;for(const[ax,ay]of[[cx,cy],[cx+sz,cy],[cx-sz,cy],[cx+sz/2,cy+sz*.8],[cx-sz/2,cy+sz*.8],[cx+sz/2,cy-sz*.8],[cx-sz/2,cy-sz*.8]]){const d=Math.hypot((x-ax)/sz,(y-ay)/(sz*.8));if(d<best)best=d}t.scales[y*G+x]=Math.max(0,1-best*best*1.6)}}
  // cheese holes
  t.holes=new Float32Array(G*G);{const r=rng(51);for(let k=0;k<13;k++){const cx=(.14+r()*.72)*G,cy=(.14+r()*.72)*G,rad=(.02+r()*.045)*G;for(let y=Math.max(0,cy-rad|0);y<Math.min(G,cy+rad+1);y++)for(let x=Math.max(0,cx-rad|0);x<Math.min(G,cx+rad+1);x++){const d=Math.hypot(x-cx,y-cy)/rad;if(d<1){const i=y*G+x;t.holes[i]=Math.max(t.holes[i],clamp((1-d)*3.5,0,1))}}}}
  // pepper speckle
  t.pepper=new Float32Array(G*G);{const r=rng(61);for(let k=0;k<G*G*.05;k++){const x=r()*G|0,y=r()*G|0;t.pepper[y*G+x]=.4+r()*.6}}
  return TEXC[G]=t;
}
function fillTex(G,fill,color){
  const key=G+fill+color;if(TEXC[key])return TEXC[key];
  const c=document.createElement('canvas');c.width=c.height=G;const x=c.getContext('2d'),b=hexRgb(color),r=rng(41);
  const lt=t=>'rgb('+b.map(v=>Math.round(v+(255-v)*t)).join(',')+')';
  x.fillStyle=lt(.3);x.fillRect(0,0,G,G);
  if(fill==='crunchy')for(let i=0;i<G*1.3;i++){const px=r()*G,py=r()*G,rad=G*(.015+r()*.028);x.fillStyle=['#fff',lt(.6),'#FFE1EA','#DDEFFF'][i%4];x.beginPath();x.arc(px,py,rad,0,7);x.fill()}
  else if(fill==='watery'){x.strokeStyle='rgba(255,255,255,.8)';for(let i=0;i<G*.3;i++){const rad=G*(.008+r()*.03);x.lineWidth=Math.max(.6,rad*.25);x.beginPath();x.arc(r()*G,r()*G,rad,0,7);x.stroke()}}
  else if(fill==='sherbet')for(let i=0;i<G*G*.3;i++){x.fillStyle=['#fff',lt(.55),'#FFCFDB','#D3EAFF','#FFF1B8'][i%5];x.fillRect(r()*G,r()*G,1.2,1.2)}
  else for(let i=0;i<G;i++){x.fillStyle='rgba(255,255,255,.45)';x.beginPath();x.arc(r()*G,r()*G,G*(.006+r()*.012),0,7);x.fill()}
  return TEXC[key]=x.getImageData(0,0,G,G).data;
}

/* ---------- the squishy as a height map, lit in 3D ---------- */
const RAD=.78;
function superE(u,v,p,rad){return Math.pow(Math.pow(Math.abs(u),p)+Math.pow(Math.abs(v),p),1/p)/rad}
function foot(kind,u,v){
  let r,h;
  switch(kind){
    case 'square':r=superE(u,v,4,.74);if(r>=1)return null;{const e=clamp((1-r)/.3,0,1);h=Math.sqrt(1-(1-e)*(1-e))*.48}break;
    case 'cube':r=superE(u,v,5,.66);if(r>=1)return null;{const e=clamp((1-r)/.26,0,1);h=Math.sqrt(1-(1-e)*(1-e))*.78}break;
    case 'oval':{const c=Math.cos(.35),sn=Math.sin(.35),uu=u*c+v*sn,vv=-u*sn+v*c,r2=(uu/.66)**2+(vv/.8)**2;if(r2>=1)return null;r=Math.sqrt(r2);h=Math.pow(1-r2,.45)*.55}break;
    case 'peach':{const r2=(u/.74)**2+((v+.02)/.72)**2;if(r2>=1)return null;r=Math.sqrt(r2);h=Math.sqrt(1-r2)*.95}break;
    case 'egg':{const w=.56*(1+.2*v),r2=(u/w)**2+(v/.8)**2;if(r2>=1)return null;r=Math.sqrt(r2);h=Math.sqrt(1-r2)*.9}break;
    case 'bun':{const r2=(u*u+v*v)/(RAD*RAD);if(r2>=1)return null;r=Math.sqrt(r2);h=Math.pow(1-r2,.42)*.6}break;
    default:{const r2=(u*u+v*v)/(RAD*RAD);if(r2>=1)return null;r=Math.sqrt(r2);h=Math.sqrt(1-r2)}
  }
  return[h,r];
}
function makeState(G){
  const n=G*G,st={G,D:new Float32Array(n),V:new Float32Array(n),T:new Float32Array(n),B:new Float32Array(n),H:new Float32Array(n),A:new Float32Array(n),H0:new Float32Array(n),tmp:new Float32Array(n),sq:0,sqv:0};
  st.cv=document.createElement('canvas');st.cv.width=st.cv.height=G;st.cx=st.cv.getContext('2d');st.img=st.cx.createImageData(G,G);return st;
}
const Lv=(()=>{const v=[-.45,-.6,.66],n=Math.hypot(...v);return v.map(x=>x/n)})();
const Hv=(()=>{const v=[Lv[0],Lv[1],Lv[2]+1],n=Math.hypot(...v);return v.map(x=>x/n)})();
const blob=(u,v,cx,cy,sx,sy)=>Math.exp(-((u-cx)**2/(2*sx*sx)+(v-cy)**2/(2*sy*sy)));
const mixc=(c,t,k)=>{c[0]+=(t[0]-c[0])*k;c[1]+=(t[1]-c[1])*k;c[2]+=(t[2]-c[2])*k};
function shade(st,o){
  const G=st.G,HT=G*.34,t=tex(G),P=PICKS[o.pick],sk=MAT[P.mat],base=hexRgb(P.base),ft=P.mat==='sugar'?fillTex(G,o.fill,P.base):null;
  const s=1+st.sq*.55,hs=1-st.sq*.9,D=st.D,B=st.B,H=st.H,A=st.A,H0=st.H0,data=st.img.data,sc=G/200,id=o.pick;
  for(let y=0;y<G;y++){const v=((y+.5)/G*2-1)/s;for(let x=0;x<G;x++){const i=y*G+x,u=((x+.5)/G*2-1)/s,f=foot(P.foot,u,v);
    if(!f){H[i]=0;A[i]=0;H0[i]=0;continue}
    const h0=f[0]*HT*hs,dn=clamp(D[i]/HT,0,1);let h=h0-D[i]+B[i];
    if(P.mat==='velvet')h+=(t.fine[i]-.5)*.5*sc+t.lumps[i]*HT*.03;
    else if(P.mat==='silk'||P.mat==='satin')h+=t.lumps[i]*HT*.03;
    if(id==='tape')h+=t.lumps[i]*HT*.05+t.creases[i]*(1.6+dn*3)*sc;
    if(id==='cheese')h+=t.lumps[i]*HT*.07-t.holes[i]*HT*.12;
    if(id==='pistachio')h+=t.creases[i]*(.45+dn*1.5)*sc+t.lumps[i]*HT*.03;
    if(id==='sugar')h+=t.crystal[i]*2.4*sc+t.lumps[i]*HT*.02;
    if(id==='choco')h+=t.scales[i]*1.1*sc+t.lumps[i]*HT*.03;
    if(id==='crispy')h+=((t.lumps[i]-.5)*HT*.14+(t.mid[i]-.5)*HT*.025)*blob(u,v,0,-.05,.3,.3);
    if(id==='peach'){ // the little crease and the leaf on top
      h-=HT*.05*Math.exp(-((u-.02-.12*(v+.6))**2)/(2*.03*.03))*clamp((v+.72)*6,0,1)*clamp((-.3-v)*6,0,1);
      const lu=(u-.16)*Math.cos(.35)+(v+.5)*Math.sin(.35),lv=-(u-.16)*Math.sin(.35)+(v+.5)*Math.cos(.35),lf=1-(lu/.3)**2-(lv/.075)**2;
      if(lf>0)h+=HT*.06*Math.sqrt(lf);
    }
    H[i]=Math.max(h,h0*.12);H0[i]=f[0];A[i]=clamp((1-f[1])*G*RAD*.45,0,1);
  }}
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){
    const i=y*G+x,p=i*4;if(A[i]<=0){data[p+3]=0;continue}
    const l=x>0?H[i-1]:H[i],r=x<G-1?H[i+1]:H[i],uu0=y>0?H[i-G]:H[i],d=y<G-1?H[i+G]:H[i];
    let nx=-(r-l)*.5,ny=-(d-uu0)*.5,nz=1;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
    const u=((x+.5)/G*2-1)/s,v=((y+.5)/G*2-1)/s,dent=clamp(D[i]/HT,0,1);
    // color, painted like the real ones
    const c=[base[0],base[1],base[2]];let km=1;
    switch(id){
      case 'salttoast':{const tz=blob(u,v,-.08,.05,.3,.25);mixc(c,[150,170,160],tz*.45+dent*.2);if(t.pepper[i]>1.02-(.22+tz*.8))mixc(c,[45,45,45],t.pepper[i]*(.45+tz*.55));break}
      case 'peach':{mixc(c,[248,200,196],clamp(H0[i]<.5?(.5-H0[i])*1.6:0,0,.6));mixc(c,[236,140,146],blob(u,v,.1,.25,.35,.3)*.35);
        const lu=(u-.16)*Math.cos(.35)+(v+.5)*Math.sin(.35),lv=-(u-.16)*Math.sin(.35)+(v+.5)*Math.cos(.35),lf=1-(lu/.3)**2-(lv/.075)**2;if(lf>0){c[0]=78;c[1]=158;c[2]=92;km=1.8}break}
      case 'honey':{const c2=Math.cos(.35),s2=Math.sin(.35),vv=-u*s2+v*c2,band=Math.pow(Math.max(0,Math.sin(vv*7.5+.6)),2);mixc(c,[232,112,38],band*.75+blob(u,v,.3,-.1,.25,.25)*.3+dent*.3);break}
