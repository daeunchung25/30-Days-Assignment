<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep | Day 22 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7;--paper:#FFFFFF;--ink:#1A1D2E;--muted:#6B7088;--line:#DCDFEA;--field:#F6F7FB;--good:#5B6CFF;--short:#F0A35E;--soft:#E7E9FF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--paper:#171A2D;--ink:#ECEEFA;--muted:#9EA3BE;--line:#272B44;--field:#12152A;--good:#8C98FF;--short:#F6B77A;--soft:#232846;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--paper:#171A2D;--ink:#ECEEFA;--muted:#9EA3BE;--line:#272B44;--field:#12152A;--good:#8C98FF;--short:#F6B77A;--soft:#232846;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:18px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.top a{color:var(--muted);font-size:14px;text-decoration:none}
.top a:hover{text-decoration:underline}
.top h1{font-size:20px;margin:0;font-weight:800}
.hero{margin:20px 0 16px;border-radius:26px;padding:24px;color:#fff;background:linear-gradient(160deg,#2A2F6B,#4B3F8F 60%,#7A5BA8);position:relative;overflow:hidden}
.hero .moon{position:absolute;right:22px;top:18px;font-size:46px;opacity:.9}
.hero .lbl{margin:0;opacity:.75;font-size:15px}
.hero .big{font-size:clamp(48px,10vw,80px);font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.02em}
.hero .sub{margin:0;opacity:.8}
.hero .goalbar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}
.hero .goalbar i{display:block;height:100%;border-radius:4px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.act{border:0;border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:800;font-size:15px;background:#fff;color:#2A2F6B}
.act.ghost{background:rgba(255,255,255,.16);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.card h2{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 button{border:0;background:none;color:var(--good);cursor:pointer;font-size:14px;text-transform:none;letter-spacing:0;font-weight:700;padding:0}
.chart{width:100%;height:auto;display:block}
.nights{list-style:none;margin:0;padding:0}
.nights li{display:grid;grid-template-columns:96px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.nights li:first-child{border-top:0}
.nights .d{font-size:14px;color:var(--muted)}
.nights .h{font-weight:800;font-size:17px}
.nights .h small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.nights .q{font-size:18px}
.nights button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.empty{color:var(--muted);margin:4px 0}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink);padding:0;width:min(420px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:22px}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.dlg input{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px;font-size:16px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.faces{display:flex;gap:6px}
.faces button{flex:1;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:8px 0;cursor:pointer;font-size:22px}
.faces button[aria-pressed="true"]{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700}
.btn.hot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.goal{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.goal input{width:70px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 8px;color:var(--ink)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.nights li{grid-template-columns:80px 1fr auto auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a id="back" href="../">Day 22 of 30</a><h1>Sleep</h1></div>

  <section class="hero" aria-live="polite">
    <div class="moon" id="moon">🌙</div>
    <p class="lbl" id="heroLbl">Last night</p>
    <p class="big" id="heroBig">–</p>
    <p class="sub" id="heroSub"></p>
    <div class="goalbar" aria-hidden="true"><i id="goalFill"></i></div>
    <div class="actions">
      <button class="act" id="bedBtn" type="button">I’m going to bed</button>
      <button class="act ghost" id="addBtn" type="button">Add a night</button>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><b id="sAvg">–</b><span>7-night average</span></div>
    <div class="stat"><b id="sBed">–</b><span>Usual bedtime</span></div>
    <div class="stat"><b id="sWake">–</b><span>Usual wake up</span></div>
    <div class="stat"><b id="sDebt">–</b><span>Sleep owed this week</span></div>
  </div>

  <div class="card">
    <h2><span>Last 14 nights</span><span class="goal"><label for="goal">Goal</label><input id="goal" type="number" min="4" max="12" step=".5"> hours</span></h2>
    <svg class="chart" id="chart" viewBox="0 0 700 240" role="img" aria-label="Hours slept each night for the last 14 nights"></svg>
  </div>

  <div class="card">
    <h2><span>Nights</span><button type="button" id="addBtn2">+ Add a night</button></h2>
    <ul class="nights" id="list"></ul>
  </div>
</div>

<dialog id="dlg"><form class="dlg" method="dialog">
  <h3 id="dlgTitle">Add a night</h3>
  <div class="two"><label>Went to bed<input type="datetime-local" id="fBed" required></label><label>Woke up<input type="datetime-local" id="fWake" required></label></div>
  <div><span style="font-size:13px;color:var(--muted)">How did you sleep? (optional)</span><div class="faces" id="fQ"></div></div>
  <div class="row"><button class="btn" type="button" id="fDel" style="margin-right:auto;color:#D2402B">Delete</button><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn hot" value="ok">Save</button></div>
</form></dialog>

<script>
(function(){
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const FACES=['😫','😕','😐','🙂','😴'];
const HOUR=36e5;

/* ---------- saved ---------- */
const SAVE='sleep-day22';
let D={nights:[],goal:8,bedAt:null};
try{const s=JSON.parse(localStorage.getItem(SAVE));if(s&&Array.isArray(s.nights))D=Object.assign(D,s)}catch(e){}
let docRef=null,saveT=null;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(D))}catch(e){}if(docRef){clearTimeout(saveT);saveT=setTimeout(()=>docRef.set(D).catch(()=>{}),500)}}

/* ---------- helpers ---------- */
const hrs=n=>(new Date(n.wake)-new Date(n.bed))/HOUR;
const hm=h=>{if(!isFinite(h))return'–';const m=Math.round(h*60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const clock=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
// average a time of day; bedtimes after midnight count as late, not early
function avgClock(list,bed){if(!list.length)return'–';let s=0;for(const d of list){const x=new Date(d);let m=x.getHours()*60+x.getMinutes();if(bed&&m<12*60)m+=24*60;s+=m}
  let m=Math.round(s/list.length)%(24*60);const h=Math.floor(m/60),mm=m%60;return((h%12)||12)+':'+String(mm).padStart(2,'0')+(h<12?' am':' pm')}
const sorted=()=>D.nights.slice().sort((a,b)=>new Date(b.wake)-new Date(a.wake));
const local=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};

/* ---------- drawing ---------- */
function render(){
  const list=sorted(),last=list[0],goal=D.goal;
  // tonight: if you tapped “going to bed”, the big card counts how long you’ve been asleep
  if(D.bedAt){const h=(Date.now()-new Date(D.bedAt))/HOUR;
    $('heroLbl').textContent='Asleep since '+clock(D.bedAt);$('heroBig').textContent=hm(h);$('heroSub').textContent='Tap “I’m awake” when you get up.';
    $('bedBtn').textContent='I’m awake ☀️';$('moon').textContent='😴';$('goalFill').style.width=Math.min(100,h/goal*100)+'%'}
  else{$('bedBtn').textContent='I’m going to bed';$('moon').textContent='🌙';
    if(last){const h=hrs(last);$('heroLbl').textContent=new Date(last.wake).toDateString()===new Date().toDateString()?'Last night':'Last logged night';
      $('heroBig').textContent=hm(h);$('heroSub').textContent=clock(last.bed)+' to '+clock(last.wake)+' · '+(h>=goal?'you hit your goal 🎉':hm(goal-h)+' short of '+goal+'h');
      $('goalFill').style.width=Math.min(100,h/goal*100)+'%'}
    else{$('heroLbl').textContent='No nights yet';$('heroBig').textContent='–';$('heroSub').textContent='Tap “I’m going to bed” tonight, or add last night.';$('goalFill').style.width='0%'}}
  // stats over the last 7 nights
  const wk=list.filter(n=>Date.now()-new Date(n.wake)<7*24*HOUR);
  const avg=wk.length?wk.reduce((s,n)=>s+hrs(n),0)/wk.length:NaN;
  $('sAvg').textContent=hm(avg);$('sBed').textContent=avgClock(wk.map(n=>n.bed),true);$('sWake').textContent=avgClock(wk.map(n=>n.wake),false);
  const debt=wk.reduce((s,n)=>s+Math.max(0,goal-hrs(n)),0);$('sDebt').textContent=wk.length?(debt<.05?'None 🎉':hm(debt)):'–';
  if(document.activeElement!==$('goal'))$('goal').value=goal;
  chart(list);
  $('list').innerHTML=list.length?list.map(n=>{const h=hrs(n);return '<li><span class="d">'+new Date(n.wake).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</span><span class="h" style="color:'+(h>=goal?'var(--good)':'var(--short)')+'">'+hm(h)+'<small>'+clock(n.bed)+' – '+clock(n.wake)+'</small></span><span class="q">'+(n.q?FACES[n.q-1]:'')+'</span><button type="button" data-e="'+n.id+'">Edit</button></li>'}).join(''):'<li><span></span><p class="empty">Nothing logged yet.</p><span></span><span></span></li>';
}
function chart(list){
  const W=700,H=240,pl=36,pb=28,pt=12,days=14,bw=(W-pl)/days,max=Math.max(10,D.goal+1,...list.map(hrs));
  const y=h=>pt+(H-pt-pb)*(1-h/max);let s='';
  for(let h=0;h<=max;h+=2){s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(h)+'" y2="'+y(h)+'" stroke="var(--line)"/><text x="'+(pl-8)+'" y="'+(y(h)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+h+'h</text>'}
  const byDay={};list.forEach(n=>{const k=dayKey(n.wake);byDay[k]=(byDay[k]||0)+hrs(n)});
  for(let i=0;i<days;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(days-1-i));const h=byDay[dayKey(d)],x=pl+i*bw+bw*.18,w=bw*.64;
    if(h)s+='<rect x="'+x+'" y="'+y(h)+'" width="'+w+'" height="'+(y(0)-y(h))+'" rx="6" fill="'+(h>=D.goal?'var(--good)':'var(--short)')+'"><title>'+hm(h)+'</title></rect>';
    else s+='<rect x="'+x+'" y="'+(y(0)-4)+'" width="'+w+'" height="4" rx="2" fill="var(--line)"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+(i===days-1?'Today':d.toLocaleDateString('en-US',{weekday:'narrow'}))+'</text>'}
  s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(D.goal)+'" y2="'+y(D.goal)+'" stroke="var(--good)" stroke-dasharray="6 5" stroke-width="2"/><text x="'+(W-4)+'" y="'+(y(D.goal)-6)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--good)">goal '+D.goal+'h</text>';
  $('chart').innerHTML=s;
}

/* ---------- logging ---------- */
$('bedBtn').onclick=()=>{
  if(!D.bedAt){D.bedAt=new Date().toISOString();save();render();return}
  const bed=D.bedAt,wake=new Date().toISOString();D.bedAt=null;
  if((new Date(wake)-new Date(bed))/HOUR>.25)D.nights.push({id:uid(),bed,wake,q:0});
  save();render();
};
let editing=null,q=0;
function paintFaces(){$('fQ').innerHTML=FACES.map((f,i)=>'<button type="button" data-q="'+(i+1)+'" aria-pressed="'+(q===i+1)+'" aria-label="'+['Terrible','Not great','Okay','Good','Great'][i]+'">'+f+'</button>').join('')}
$('fQ').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;q=q===+b.dataset.q?0:+b.dataset.q;paintFaces()};
function openDlg(n){editing=n||null;$('dlgTitle').textContent=n?'Edit night':'Add a night';
  if(n){$('fBed').value=local(n.bed);$('fWake').value=local(n.wake);q=n.q||0}
  else{const w=new Date();w.setHours(8,0,0,0);const b=new Date(w);b.setDate(b.getDate()-1);b.setHours(0,30,0,0);b.setDate(b.getDate()+1);
    const bed=new Date(w.getTime()-7.5*HOUR);$('fBed').value=local(bed);$('fWake').value=local(w);q=0}
  $('fDel').hidden=!n;paintFaces();$('dlg').showModal()}
$('addBtn').onclick=()=>openDlg();$('addBtn2').onclick=()=>openDlg();
$('list').onclick=e=>{const b=e.target.closest('[data-e]');if(b)openDlg(D.nights.find(n=>n.id===b.dataset.e))};
$('fDel').onclick=()=>{D.nights=D.nights.filter(n=>n!==editing);save();$('dlg').close('cancel');render()};
$('dlg').addEventListener('close',()=>{if($('dlg').returnValue!=='ok')return;
  let bed=new Date($('fBed').value),wake=new Date($('fWake').value);if(wake<=bed)wake=new Date(wake.getTime()+24*HOUR);
  const v={bed:bed.toISOString(),wake:wake.toISOString(),q};
  if(editing)Object.assign(editing,v);else D.nights.push({id:uid(),...v});save();render()});
$('goal').addEventListener('change',()=>{const g=Math.max(4,Math.min(12,+$('goal').value||8));D.goal=g;save();render()});

render();setInterval(()=>{if(D.bedAt)render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
function connect(){
  if(docRef||!(window.claude&&typeof window.claude.use==='function'))return false;
  $('back').href='https://claude.ai/artifact/8XtxNzRVg4mMWQh9EwK3sc';
  (async()=>{try{const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
    docRef=db.doc('data/users/'+id+'/sleep');const snap=await docRef.get();
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.nights)){D=Object.assign({goal:8,bedAt:null},d);try{localStorage.setItem(SAVE,JSON.stringify(D))}catch(e){}render()}}else if(D.nights.length)docRef.set(D).catch(()=>{})}catch(e){docRef=null}})();
  return true;
}
if(!connect())window.addEventListener('load',()=>{if(!connect())setTimeout(connect,1500)});
})();
</script>
</body>
</html>
