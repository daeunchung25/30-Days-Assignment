<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closet | Day 4 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEEEB;--surface:#FAFAF8;--ink:#161616;--muted:#6E6C68;--line:#DAD8D3;--accent:#2F4BC8;--on-accent:#FFFFFF;--chip:#E4E2DD;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141414;--surface:#1D1D1C;--ink:#EDEBE7;--muted:#9A9893;--line:#2E2D2B;--accent:#8DA2FF;--on-accent:#10142A;--chip:#262624;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414;--surface:#1D1D1C;--ink:#EDEBE7;--muted:#9A9893;--line:#2E2D2B;--accent:#8DA2FF;--on-accent:#10142A;--chip:#262624;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 80px}
.serif{font-family:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;font-weight:500}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.top a{color:var(--muted);font-size:14px;text-decoration:none}
.top a:hover{text-decoration:underline}
.top h1{font-size:22px;margin:0;letter-spacing:.01em}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ai{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;padding:36px 0 40px;align-items:start}
.headline{font-size:clamp(34px,5.5vw,58px);line-height:1.04;margin:0 0 18px;letter-spacing:-.01em}
.weather{font-size:15px;color:var(--muted);margin:0 0 18px}
.weather b{color:var(--ink);font-weight:500}
.wx-edit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 18px;display:grid;gap:10px;font-size:14px}
.wx-edit .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wx-edit input[type=text]{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.wx-edit input[type=range]{flex:1}
.label{font-size:13px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.why{margin:22px 0 0;padding:0;list-style:none;font-size:15px;max-width:48ch}
.why li{padding:8px 0;border-top:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ai-note{font-size:13px;color:var(--muted);margin-top:10px}

.lay{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:14px;min-height:420px;align-items:center}
.lay .col{display:grid;gap:14px;align-content:center}
.piece{text-align:center}
.piece .pic{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;overflow:hidden}
.piece .pic img{width:100%;height:100%;object-fit:contain}
.piece .pic svg{width:86%;height:86%}
.piece .cap{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}
.piece.empty .pic{border:1.5px dashed var(--line)}
.piece.empty .cap{font-style:italic}
.palette{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:14px}
.palette span{flex:1}
.lay-wrap .names{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.lay-wrap .names i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;border:1px solid rgba(0,0,0,.15)}

.closet{border-top:1px solid var(--line);padding-top:30px}
.closet-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.closet-head h2{font-size:30px;margin:0}
.closet-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.filters{margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--ink)}
.card .pic{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;overflow:hidden;background:var(--bg)}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .pic svg{width:78%;height:78%}
.card .nm{font-size:14px;font-weight:500;margin-top:8px;line-height:1.3}
.card .sub{font-size:12px;color:var(--muted)}
.empty-closet{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.empty-closet .actions{justify-content:center}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,10,10,.5)}
.dlg{padding:22px}
.dlg h2{font-size:26px;margin:0 0 14px}
.photo{display:grid;place-items:center;height:200px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);cursor:pointer;overflow:hidden;color:var(--muted);font-size:14px;text-align:center;padding:10px}
.photo img{max-width:100%;max-height:100%;object-fit:contain}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-top:14px}
.field input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colorrow{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.colorrow input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg);cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}

@media (max-width:820px){
  .today{grid-template-columns:1fr;gap:24px}
  .lay{padding:14px;gap:10px;min-height:0}
}
@media (prefers-reduced-motion:no-preference){
  .lay.fresh .piece{animation:drop .45s ease-out both}
  .lay.fresh .piece:nth-child(2){animation-delay:.06s}
  @keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a id="back" href="../">Day 4 of 30</a>
    <h1 class="serif">Closet</h1>
  </div>

  <section class="today">
    <div>
      <p class="headline serif" id="headline">What to wear today.</p>
      <p class="weather" id="weather">Checking the weather…</p>
      <div class="wx-edit" id="wxEdit" hidden>
        <div class="row"><input type="text" id="city" placeholder="City, like New York" aria-label="City"><button class="btn" id="cityGo" type="button">Use city</button></div>
        <div class="row" id="manualRow"><span>Or set it:</span><input type="range" id="tempIn" min="10" max="100" step="1" aria-label="Temperature"><b id="tempOut"></b><label><input type="checkbox" id="rainIn"> Rain</label></div>
        <p id="wxMsg" style="margin:0;color:var(--muted)"></p>
      </div>
      <p class="label">Where are you going?</p>
      <div class="chips" id="occasions" role="group" aria-label="Occasion"></div>
      <ul class="why" id="why"></ul>
      <div class="actions">
        <button class="btn primary" id="another" type="button">Show me another</button>
        <button class="btn ai" id="askAI" type="button" hidden>Ask Claude to style it</button>
        <button class="btn" id="wear" type="button">I’m wearing this</button>
      </div>
      <p class="ai-note" id="aiNote"></p>
    </div>
    <div class="lay-wrap">
      <div class="lay" id="lay" aria-live="polite"></div>
      <div class="palette" id="palette" aria-hidden="true"></div>
      <div class="names" id="names"></div>
    </div>
  </section>

  <section class="closet">
    <div class="closet-head">
      <div><h2 class="serif">Your closet</h2><p id="count"></p></div>
      <button class="btn primary" id="addBtn" type="button">Add clothes</button>
    </div>
    <div class="chips filters" id="filters" role="group" aria-label="Show"></div>
    <div id="gridWrap"></div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="dlg" id="form" method="dialog">
    <h2 class="serif" id="dlgTitle">Add clothes</h2>
    <label class="photo" id="photoBox" tabindex="0">
      <span id="photoHint">Take a photo or pick one.<br>Lay it flat or hang it against a plain wall.</span>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </label>
    <div class="two">
      <label class="field">What is it<input type="text" id="fName" placeholder="Black turtleneck" maxlength="60"></label>
      <label class="field">Brand<input type="text" id="fBrand" placeholder="Uniqlo" maxlength="40"></label>
    </div>
    <div class="field">Type<div class="chips" id="fCat" role="group" aria-label="Type"></div></div>
    <div class="field">Color
      <div class="colorrow"><input type="color" id="fColor" aria-label="Color"><span id="fColorName"></span><span id="fColorFrom" style="color:var(--muted);font-size:13px"></span></div>
    </div>
    <div class="field">How warm<div class="seg" id="fWarm" role="group" aria-label="How warm">
      <button type="button" data-v="1">Light</button><button type="button" data-v="2">Medium</button><button type="button" data-v="3">Warm</button></div></div>
    <div class="field">Good for<div class="chips" id="fStyle" role="group" aria-label="Good for"></div></div>
    <div class="actions" id="aiRow" hidden><button class="btn ai" type="button" id="aiFill">Fill in with Claude</button></div>
    <p class="status" id="fStatus"></p>
    <div class="dlg-foot">
      <button class="btn" type="button" id="fDelete">Remove</button>
      <span style="display:flex;gap:8px"><button class="btn" type="button" id="fCancel">Cancel</button><button class="btn primary" type="submit">Save</button></span>
    </div>
  </form>
</dialog>

<script>
(function(){
/* ---------- constants ---------- */
const CATS=[['top','Top'],['bottom','Bottom'],['dress','Dress'],['outer','Outerwear'],['shoes','Shoes'],['extra','Bag & extras']];
const STYLES=[['casual','Casual'],['smart','Smart'],['dressy','Dressy'],['active','Active']];
const OCC=[
  {id:'class',label:'Class',want:['casual','smart']},
  {id:'errands',label:'Errands',want:['casual']},
  {id:'work',label:'Work',want:['smart','casual']},
  {id:'interview',label:'Interview',want:['dressy','smart']},
  {id:'date',label:'Date night',want:['smart','dressy']},
  {id:'out',label:'Going out',want:['dressy','smart']},
  {id:'gym',label:'Gym',want:['active']},
  {id:'home',label:'Staying in',want:['casual','active']}
];
const NAMED=[['black','#111111'],['charcoal','#36454F'],['grey','#8A8A8A'],['light grey','#CFCFCF'],['white','#F7F7F5'],['cream','#F1E9D2'],['beige','#D9C7A7'],['tan','#C19A6B'],['camel','#B5835A'],['brown','#6B4423'],['navy','#1F2A44'],['blue','#2F5DA8'],['light blue','#A7C7E7'],['denim','#5A7BA6'],['teal','#2A7F7F'],['green','#2E7D32'],['sage','#A3B18A'],['olive','#6B6B3A'],['khaki','#B8AD82'],['red','#C62828'],['burgundy','#6D1A2B'],['pink','#E8A0B4'],['blush','#F2C9C4'],['purple','#6A3D9A'],['lavender','#C3B1E1'],['yellow','#F2D04B'],['mustard','#C9A227'],['orange','#E07B39'],['rust','#B0502C']];
const SHAPES={
  top:'<path d="M30 18 L42 11 Q50 18 58 11 L70 18 L87 33 L77 43 L70 37 L70 88 L30 88 L30 37 L23 43 L13 33 Z"/>',
  bottom:'<path d="M31 9 L69 9 L74 91 L56 91 L50 38 L44 91 L26 91 Z"/>',
  dress:'<path d="M41 7 L59 7 L58 30 L77 91 L23 91 L42 30 Z"/>',
  outer:'<path d="M33 11 L44 7 L50 22 L56 7 L67 11 L86 30 L80 91 L20 91 L14 30 Z"/><path d="M50 22 L50 91" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1.5"/>',
  shoes:'<path d="M9 60 Q11 42 26 44 L40 50 Q56 56 74 58 Q91 60 91 72 L91 79 L9 79 Z"/>',
  skirt:'<path d="M33 14 L67 14 L80 88 L20 88 Z"/>',
  boots:'<path d="M28 14 L48 14 L50 56 Q66 58 82 64 Q91 68 91 76 L91 82 L26 82 Z"/>',
  extra:'<path d="M38 42 Q38 20 50 20 Q62 20 62 42" fill="none" stroke="currentColor" stroke-width="4"/><path d="M24 40 L76 40 L81 88 L19 88 Z"/>'
};
const DEMO=[
  ['White tee','top','#F5F5F2',1,['casual']],['Navy sweater','top','#1F2A44',3,['casual','smart']],['Light blue shirt','top','#A7C7E7',1,['smart','casual']],['Black turtleneck','top','#151515',2,['smart','dressy']],['Grey sports tee','top','#9AA3AD',1,['active']],
  ['Straight jeans','bottom','#5A7BA6',2,['casual']],['Cream trousers','bottom','#EFE6D2',2,['smart','dressy']],['Black midi skirt','bottom','#1A1A1A',1,['smart','dressy']],['Black leggings','bottom','#202020',1,['active']],
  ['Burgundy slip dress','dress','#6D1A2B',1,['dressy']],
  ['Camel coat','outer','#B5835A',3,['smart','dressy','casual']],['Denim jacket','outer','#6E8DB8',2,['casual']],['Khaki trench','outer','#B8AD82',2,['casual','smart']],
  ['White sneakers','shoes','#F2F2EF',1,['casual']],['Black loafers','shoes','#1A1A1A',1,['smart','dressy']],['Brown boots','shoes','#6B4423',3,['casual','smart']],['Running shoes','shoes','#8A95A3',1,['active']],
  ['Tan tote','extra','#C19A6B',1,['casual','smart']]
];

/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function hexToRgb(h){h=String(h||'#888888').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')}
function hsl(hex){let[r,g,b]=hexToRgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
function lab(hex){let[r,g,b]=hexToRgb(hex).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4});const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;const x=f((r*.4124+g*.3576+b*.1805)/.95047),y=f(r*.2126+g*.7152+b*.0722),z=f((r*.0193+g*.1192+b*.9505)/1.08883);return[116*y-16,500*(x-y),200*(y-z)]}
const NAMED_LAB=NAMED.map(n=>[n[0],lab(n[1])]);
function colorName(hex){const a=lab(hex);let best=NAMED_LAB[0],bd=1e9;for(const n of NAMED_LAB){const d=(a[0]-n[1][0])**2+(a[1]-n[1][1])**2+(a[2]-n[1][2])**2;if(d<bd){bd=d;best=n}}return best[0]}
function isNeutral(hex){const{h,s,l}=hsl(hex);if(s<.18||l<.14||l>.9)return true;if(h>=18&&h<=55&&s<.6&&l>.2&&l<.96)return true;if(h>=200&&h<=235&&(l<.32||s<.45))return true;return false}
const hueDiff=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
const shapeKey=(it)=>it.cat==='bottom'&&/skirt/i.test(it.name||'')?'skirt':it.cat==='shoes'&&/boot/i.test(it.name||'')?'boots':it.cat;
const silhouette=(cat,color)=>'<svg viewBox="0 0 100 100" aria-hidden="true" fill="'+esc(color)+'" stroke="rgba(0,0,0,.18)" stroke-width="1.2" style="color:'+esc(color)+'">'+(SHAPES[cat]||SHAPES.top)+'</svg>';
const picOf=(it)=>it.photo?'<img src="'+esc(it.photo)+'" alt="">':silhouette(shapeKey(it),it.color);

/* ---------- storage (IndexedDB, with a memory fallback) ---------- */
let items=[],idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('closet-day4',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function dbAll(){return new Promise(res=>{if(!idb)return res([]);const q=idb.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function dbPut(it){if(!idb)return;try{idb.transaction('items','readwrite').objectStore('items').put(it)}catch(e){}}
function dbDel(id){if(!idb)return;try{idb.transaction('items','readwrite').objectStore('items').delete(id)}catch(e){}}
const prefs=(()=>{try{return JSON.parse(localStorage.getItem('closet-day4-prefs'))||{}}catch(e){return{}}})();
function savePrefs(){try{localStorage.setItem('closet-day4-prefs',JSON.stringify(prefs))}catch(e){}}
prefs.occ=prefs.occ||'class';prefs.city=prefs.city||'New York';
if(typeof prefs.temp!=='number')prefs.temp=55;

/* ---------- weather ---------- */
let wx=null;
const WCODE=c=>c===0?'clear':c<=2?'partly cloudy':c===3?'cloudy':c<=48?'foggy':c<=57?'drizzly':c<=67?'rainy':c<=77?'snowy':c<=82?'showery':c<=86?'snowy':'stormy';
async function loadWeather(){
  try{
    const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(prefs.city)).then(r=>r.json());
    const p=g&&g.results&&g.results[0];if(!p)throw new Error('city');
    const u='https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,apparent_temperature,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1';
    const w=await fetch(u).then(r=>r.json());
    const code=w.current.weather_code;
    wx={temp:Math.round(w.current.temperature_2m),feels:Math.round(w.current.apparent_temperature),hi:Math.round(w.daily.temperature_2m_max[0]),lo:Math.round(w.daily.temperature_2m_min[0]),rain:(w.daily.precipitation_probability_max[0]||0)>=50||(code>=51&&code<=67)||(code>=80&&code<=82),desc:WCODE(code),live:true,place:p.name};
    $('wxMsg').textContent='';
  }catch(e){
    wx={temp:prefs.temp,feels:prefs.temp,rain:!!prefs.rain,live:false};
    $('wxEdit').hidden=false;
    $('wxMsg').textContent=e.message==='city'?'Couldn’t find that city. Try another, or set the weather yourself.':'Live weather isn’t available here, so set it yourself.';
  }
  renderWeather();generate(true);
}
function planTemp(){return wx?(wx.live?Math.round((wx.feels+Math.min(wx.lo,wx.feels))/2):wx.temp):55}
function renderWeather(){
  const el=$('weather');
  if(!wx){el.textContent='Checking the weather…';return}
  if(wx.live)el.innerHTML='<b>'+esc(wx.place)+'</b>, '+wx.temp+'°F and '+esc(wx.desc)+', feels like '+wx.feels+'°. High '+wx.hi+'°, low '+wx.lo+'°'+(wx.rain?', rain likely':'')+'. <button class="link" id="wxToggle" type="button">Change</button>';
  else el.innerHTML='Planning for <b>'+wx.temp+'°F'+(wx.rain?' with rain':'')+'</b>. <button class="link" id="wxToggle" type="button">Change</button>';
  $('wxToggle').onclick=()=>{$('wxEdit').hidden=!$('wxEdit').hidden};
  $('tempIn').value=wx.live?wx.feels:wx.temp;$('tempOut').textContent=$('tempIn').value+'°F';$('rainIn').checked=!!wx.rain;$('city').value=prefs.city;
}
$('cityGo').onclick=()=>{const v=$('city').value.trim();if(!v)return;prefs.city=v;savePrefs();$('weather').textContent='Checking the weather…';loadWeather()};
$('city').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('cityGo').click()}});
$('tempIn').oninput=()=>{$('tempOut').textContent=$('tempIn').value+'°F'};
const manual=()=>{prefs.temp=+$('tempIn').value;prefs.rain=$('rainIn').checked;savePrefs();wx={temp:prefs.temp,feels:prefs.temp,rain:prefs.rain,live:false};renderWeather();generate(true)};
$('tempIn').onchange=manual;$('rainIn').onchange=manual;

/* ---------- outfit picking ---------- */
let current=null,lastKeys=[],aiWhy=null;
function occ(){return OCC.find(o=>o.id===prefs.occ)||OCC[0]}
function styleScore(it,o){
  if(!it.styles||!it.styles.length)return 0;
  if(it.styles.includes(o.want[0]))return 3;
  if(o.want.some(w=>it.styles.includes(w)))return 1.5;
  if(o.id==='gym')return -8;
  if(it.styles.includes('active'))return -5;
  return -3;
}
function needs(T,rain){
  if(T>=76)return{warm:1,outer:'no'};
  if(T>=64)return{warm:1.5,outer:rain?'yes':'maybe'};
  if(T>=48)return{warm:2,outer:'yes'};
  return{warm:3,outer:'yes'};
}
function needsFor(o,T,rain){const n=needs(T,rain);if((o.id==='gym'||o.id==='home')&&n.outer==='yes'&&T>=45)n.outer='maybe';if(o.id==='home')n.outer=T<45?'maybe':'no';return n}
function harmony(pieces){
  const cols=pieces.map(p=>p.color);
  const pops=[];
  cols.forEach(c=>{if(!isNeutral(c)){const h=hsl(c).h;if(!pops.some(x=>hueDiff(x.h,h)<22))pops.push({h,c})}});
  if(pops.length===0)return{score:1.5,kind:'neutral'};
  if(pops.length===1)return{score:2.5,kind:'pop',pop:pops[0].c};
  if(pops.length===2){const d=hueDiff(pops[0].h,pops[1].h);if(d<=50)return{score:1.5,kind:'analogous',a:pops[0].c,b:pops[1].c};if(d>=140)return{score:1,kind:'complement',a:pops[0].c,b:pops[1].c};return{score:-2.5,kind:'clash',a:pops[0].c,b:pops[1].c}}
  return{score:-3.5,kind:'busy'};
}
function scoreOutfit(o,set,T,rain,n){
  let s=0;
  for(const p of set)s+=styleScore(p,o);
  for(const p of set){if(p.cat==='outer'||p.cat==='shoes'||p.cat==='extra')continue;s-=Math.abs((p.warmth||2)-n.warm)*1.5}
  const outer=set.find(p=>p.cat==='outer');
  if(n.outer==='yes'&&!outer)s-=6;
  if(n.outer==='no'&&outer)s-=6;
  if(outer&&T<45)s-=(3-(outer.warmth||2))*2.5;
  if(outer&&T>=55&&(outer.warmth||2)>=3)s-=2;
  if(outer&&T>=66)s-=1.5;
  const shoes=set.find(p=>p.cat==='shoes');if(shoes&&T<40&&(shoes.warmth||1)<2)s-=1;if(shoes&&T>=72&&(shoes.warmth||1)>=3)s-=2.5;
  s+=harmony(set.filter(p=>p.cat!=='extra')).score;
  const now=Date.now();for(const p of set)if(p.lastWorn&&now-p.lastWorn<2*864e5)s-=2;
  return s;
}
function generate(fresh){
  aiWhy=null;
  const o=occ(),T=planTemp(),rain=!!(wx&&wx.rain),n=needsFor(o,T,rain);
  const by=c=>items.filter(i=>i.cat===c).sort((a,b)=>styleScore(b,o)-styleScore(a,o));
  const tops=by('top').slice(0,12),bottoms=by('bottom').slice(0,12),dresses=by('dress').slice(0,8),shoes=by('shoes').slice(0,6),outers=by('outer').slice(0,5),extras=by('extra').slice(0,4);
  const bases=[];
  tops.forEach(t=>bottoms.forEach(b=>bases.push([t,b])));
  dresses.forEach(d=>bases.push([d]));
  if(!bases.length){tops.forEach(t=>bases.push([t]));bottoms.forEach(b=>bases.push([b]))}
  const shoeOpts=shoes.length?shoes:[null],outerOpts=[null,...outers];
  const cands=[];
  for(const b of bases)for(const sh of shoeOpts)for(const ou of outerOpts){
    const set=[...b,sh,ou].filter(Boolean);
    const key=set.map(p=>p.id).sort().join('|');
    cands.push({set,key,score:scoreOutfit(o,set,T,rain,n)+Math.random()*1.2});
  }
  cands.sort((a,b)=>b.score-a.score);
  if(fresh)lastKeys=[];
  let pick=cands.find(c=>!lastKeys.includes(c.key))||cands[0]||null;
  if(pick&&o.id!=='gym'&&extras.length){
    let best=null,bs=-1e9;
    for(const e of extras){const sc=styleScore(e,o)+harmony([...pick.set,e]).score;if(sc>bs){bs=sc;best=e}}
    if(best&&bs>0)pick={...pick,set:[...pick.set,best]};
  }
  if(pick){lastKeys.push(pick.key);if(lastKeys.length>40)lastKeys.shift()}
  current=pick?pick.set:null;
  renderOutfit(true);
}
function explain(set){
  const o=occ(),T=planTemp(),rain=!!(wx&&wx.rain),n=needsFor(o,T,rain),out=[];
  if(!items.length){out.push('Add a few things to your closet and an outfit shows up here.');return out}
  const outer=set.find(p=>p.cat==='outer'),hasShoes=set.some(p=>p.cat==='shoes');
  const tTxt=T+'°'+(rain?' with rain':'');
  if(n.outer==='no')out.push('It’s about '+tTxt+', so keep it light and skip the jacket.');
  else if(outer)out.push('It’s about '+tTxt+', so the '+outer.name.toLowerCase()+' goes on top.'+(rain&&!/trench|rain|shell/i.test(outer.name)?' Bring an umbrella.':''));
  else if(n.outer==='yes')out.push('It’s about '+tTxt+', so you’ll want a jacket. '+(items.some(i=>i.cat==='outer')?'None of yours suit this one.':'Add one to your closet.'));
  else out.push('It’s about '+tTxt+', mild enough to go without a jacket.');
  const h=harmony(set.filter(p=>p.cat!=='extra'));
  const names=[...new Set(set.filter(p=>p.cat!=='extra').map(p=>colorName(p.color)))];
  const list=a=>a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  if(h.kind==='neutral')out.push('Everything is a neutral ('+list(names)+'), so it all goes together.');
  else if(h.kind==='pop'){const pn=colorName(h.pop);const rest=names.filter(x=>x!==pn);out.push((rest.length?list(rest)+(rest.length===1?' keeps':' keep')+' it calm, and ':'')+'the '+pn+' is the one pop of color.')}
  else if(h.kind==='analogous')out.push('The '+colorName(h.a)+' and '+colorName(h.b)+' sit next to each other on the color wheel, so they blend.');
  else if(h.kind==='complement')out.push('The '+colorName(h.a)+' and '+colorName(h.b)+' are opposites on the color wheel, so each one stands out.');
  else out.push('The colors compete a bit. Try “Show me another” or add more neutrals.');
  const fit=set.filter(p=>p.styles&&p.styles.some(s=>o.want.includes(s))).length;
  if(fit===set.length)out.push('Every piece works for '+o.label.toLowerCase()+'.');
  else out.push('Not everything here is right for '+o.label.toLowerCase()+', since your closet is short on '+o.want[0]+' pieces.');
  if(!hasShoes)out.push('Add shoes to finish the look.');
  return out.map(t=>t.charAt(0).toUpperCase()+t.slice(1));
}
function renderOutfit(fresh){
  const o=occ(),lay=$('lay'),T=planTemp();
  $('headline').textContent='For '+o.label.toLowerCase()+', '+T+'°'+(wx&&wx.rain?' and rainy':'')+'.';
  const set=current||[];
  const get=c=>set.find(p=>p.cat===c);
  const piece=(it,cat,label)=>it?'<div class="piece"><div class="pic">'+picOf(it)+'</div><div class="cap">'+esc(it.name)+'</div></div>':'<div class="piece empty"><div class="pic"></div><div class="cap">'+label+'</div></div>';
  const dress=get('dress'),n=needsFor(o,T,!!(wx&&wx.rain));
  const left=(get('outer')||n.outer==='yes')?piece(get('outer'),'outer','no jacket'):'';
  const mid=dress?piece(dress,'dress',''):piece(get('top'),'top','add a top')+piece(get('bottom'),'bottom','add a bottom');
  const right=piece(get('shoes'),'shoes','add shoes')+(get('extra')?piece(get('extra'),'extra',''):'');
  lay.innerHTML='<div class="col">'+left+'</div><div class="col">'+mid+'</div><div class="col">'+right+'</div>';
  if(fresh){lay.classList.remove('fresh');void lay.offsetWidth;lay.classList.add('fresh')}
  const cols=set.map(p=>p.color);
  $('palette').innerHTML=cols.map(c=>'<span style="background:'+esc(c)+'"></span>').join('');
  const seen=new Set();
  $('names').innerHTML=set.filter(p=>{const n=colorName(p.color);if(seen.has(n))return false;seen.add(n);return true}).map(p=>'<span><i style="background:'+esc(p.color)+'"></i>'+esc(colorName(p.color))+'</span>').join('');
  $('why').innerHTML=(aiWhy?[aiWhy]:explain(set)).map(t=>'<li>'+esc(t)+'</li>').join('');
  $('another').disabled=!items.length;$('wear').disabled=!set.length;
}
$('another').onclick=()=>generate(false);
$('wear').onclick=()=>{if(!current)return;const t=Date.now();current.forEach(p=>{p.lastWorn=t;dbPut(p)});$('wear').textContent='Logged for today';setTimeout(()=>{$('wear').textContent='I’m wearing this'},1600)};

/* ---------- occasion + filters ---------- */
function renderOcc(){$('occasions').innerHTML=OCC.map(o=>'<button type="button" class="chip" data-v="'+o.id+'" aria-pressed="'+(o.id===prefs.occ)+'">'+o.label+'</button>').join('')}
$('occasions').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;prefs.occ=b.dataset.v;savePrefs();renderOcc();generate(true)};
let filter='all';
function renderCloset(){
  $('count').textContent=items.length?items.length+(items.length===1?' piece':' pieces')+'. Click one to edit it.':'Nothing here yet.';
  const counts={};items.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  $('filters').innerHTML=items.length?['<button type="button" class="chip" data-f="all" aria-pressed="'+(filter==='all')+'">All</button>'].concat(CATS.filter(c=>counts[c[0]]).map(c=>'<button type="button" class="chip" data-f="'+c[0]+'" aria-pressed="'+(filter===c[0])+'">'+c[1]+' '+counts[c[0]]+'</button>')).join(''):'';
  const list=items.filter(i=>filter==='all'||i.cat===filter);
  $('gridWrap').innerHTML=items.length?'<div class="grid">'+list.map(it=>'<button type="button" class="card" data-id="'+esc(it.id)+'"><div class="pic">'+picOf(it)+'</div><div class="nm">'+esc(it.name)+'</div><div class="sub">'+esc([it.brand,colorName(it.color)].filter(Boolean).join(', '))+'</div></button>').join('')+'</div>'
    :'<div class="empty-closet"><p>Add your clothes with a photo, or type the brand and what it is.</p><div class="actions"><button class="btn primary" type="button" id="emptyAdd">Add clothes</button><button class="btn" type="button" id="demo">Try it with sample clothes</button></div></div>';
  if($('emptyAdd'))$('emptyAdd').onclick=()=>openForm(null);
  if($('demo'))$('demo').onclick=()=>{DEMO.forEach(d=>{const it={id:uid(),name:d[0],cat:d[1],color:d[2],warmth:d[3],styles:d[4],brand:'',photo:null,demo:true};items.push(it);dbPut(it)});renderCloset();generate(true)};
}
$('filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;renderCloset()};
$('gridWrap').onclick=e=>{const c=e.target.closest('.card');if(!c)return;openForm(items.find(i=>i.id===c.dataset.id))};
$('addBtn').onclick=()=>openForm(null);

/* ---------- add / edit form ---------- */
const dlg=$('dlg');let draft=null,editingId=null;
function chipsHTML(list,sel,multi){return list.map(c=>'<button type="button" class="chip" data-v="'+c[0]+'" aria-pressed="'+(multi?sel.includes(c[0]):sel===c[0])+'">'+c[1]+'</button>').join('')}
function paintForm(){
  $('fCat').innerHTML=chipsHTML(CATS,draft.cat,false);
  $('fStyle').innerHTML=chipsHTML(STYLES,draft.styles,true);
  document.querySelectorAll('#fWarm button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===draft.warmth));
  $('fColor').value=draft.color;$('fColorName').textContent=colorName(draft.color);
  $('photoBox').querySelectorAll('img').forEach(i=>i.remove());
  if(draft.photo){const img=new Image();img.src=draft.photo;img.alt='Your photo';$('photoBox').prepend(img);$('photoHint').hidden=true}else $('photoHint').hidden=false;
}
function openForm(it){
  editingId=it?it.id:null;
  draft=it?JSON.parse(JSON.stringify(it)):{id:uid(),name:'',brand:'',cat:'top',color:'#888888',warmth:2,styles:['casual'],photo:null};
  $('dlgTitle').textContent=it?'Edit':'Add clothes';
  $('fName').value=draft.name;$('fBrand').value=draft.brand||'';$('fColorFrom').textContent='';$('fStatus').textContent='';
  $('fDelete').hidden=!it;
  paintForm();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
}
$('fCat').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;draft.cat=b.dataset.v;paintForm()};
$('fStyle').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=b.dataset.v;draft.styles=draft.styles.includes(v)?draft.styles.filter(x=>x!==v):[...draft.styles,v];paintForm()};
$('fWarm').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;draft.warmth=+b.dataset.v;paintForm()};
$('fColor').oninput=()=>{draft.color=$('fColor').value;$('fColorName').textContent=colorName(draft.color);$('fColorFrom').textContent=''};
$('photoBox').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
$('file').onchange=()=>{
  const f=$('file').files&&$('file').files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{
    const M=560,sc=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    draft.photo=c.toDataURL('image/jpeg',.82);
    draft.color=pickColor(img);$('fColorFrom').textContent='picked from your photo';
    URL.revokeObjectURL(url);$('file').value='';paintForm();
  };
  img.src=url;
};
function pickColor(img){
  const S=48,c=document.createElement('canvas');c.width=S;c.height=S;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,S,S);
  const d=g.getImageData(0,0,S,S).data;
  let br=0,bg=0,bb=0,bn=0;
  for(let i=0;i<S;i++)for(const[x,y]of[[i,0],[i,S-1],[0,i],[S-1,i]]){const k=(y*S+x)*4;br+=d[k];bg+=d[k+1];bb+=d[k+2];bn++}
  br/=bn;bg/=bn;bb/=bn;
  const buckets={};let ar=0,ag=0,ab=0,an=0;
  for(let y=Math.floor(S*.18);y<S*.82;y++)for(let x=Math.floor(S*.18);x<S*.82;x++){
    const k=(y*S+x)*4,r=d[k],gg=d[k+1],b=d[k+2];ar+=r;ag+=gg;ab+=b;an++;
    if(Math.hypot(r-br,gg-bg,b-bb)<42)continue;
    const key=(r>>5)+','+(gg>>5)+','+(b>>5);const o=buckets[key]||(buckets[key]={n:0,r:0,g:0,b:0});o.n++;o.r+=r;o.g+=gg;o.b+=b;
  }
  let best=null;for(const k in buckets)if(!best||buckets[k].n>best.n)best=buckets[k];
  return best?rgbToHex(best.r/best.n,best.g/best.n,best.b/best.n):rgbToHex(ar/an,ag/an,ab/an);
}
$('fCancel').onclick=()=>dlg.close();
$('fDelete').onclick=()=>{if(!editingId)return;if(!confirm('Remove this from your closet?'))return;items=items.filter(i=>i.id!==editingId);dbDel(editingId);dlg.close();renderCloset();generate(true)};
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  draft.name=$('fName').value.trim()||(colorName(draft.color)+' '+(CATS.find(c=>c[0]===draft.cat)||['',''])[1].toLowerCase());
  draft.name=draft.name.charAt(0).toUpperCase()+draft.name.slice(1);
  draft.brand=$('fBrand').value.trim();
  if(!draft.styles.length)draft.styles=['casual'];
  const i=items.findIndex(x=>x.id===draft.id);
  if(i>=0)items[i]=draft;else items.push(draft);
  dbPut(draft);dlg.close();renderCloset();generate(true);
});

/* ---------- Claude (only on claude.ai) ---------- */
let sample=null;
const ITEM_SPEC='Reply with JSON only: {"name": short name like "Black wool turtleneck", "category": one of "top","bottom","dress","outer","shoes","extra", "color": main color as a hex code like "#1f2a44", "warmth": 1 for light, 2 for medium, 3 for warm, "styles": array using only "casual","smart","dressy","active", "brand": brand if known or ""}';
function dataUrlToBlob(u){const[h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
function aiError(e){const c=e&&e.code;return c==='not_granted'?'Claude wasn’t allowed this time.':c==='rate_limited'?'Too many requests. Wait a moment and try again.':'Claude couldn’t do that right now.'}
$('aiFill').onclick=async()=>{
  if(!sample)return;
  const name=$('fName').value.trim(),brand=$('fBrand').value.trim();
  if(!draft.photo&&!name&&!brand){$('fStatus').textContent='Add a photo, or type the brand and what it is first.';return}
  $('aiFill').disabled=true;$('fStatus').textContent='Asking Claude…';
  try{
    let r;
    if(draft.photo)r=await sample.json('This photo shows one piece of clothing from someone’s closet. Identify it'+(name||brand?' (they called it: '+[brand,name].filter(Boolean).join(' ')+')':'')+'. '+ITEM_SPEC,{images:[dataUrlToBlob(draft.photo)],modelTier:'quick'});
    else r=await sample.json('Someone owns this piece of clothing: "'+[brand,name].filter(Boolean).join(' ')+'". Based on what you know about this brand and product, describe it. If the color isn’t clear from the description, use the product’s most common color. '+ITEM_SPEC,{modelTier:'quick'});
    if(r&&typeof r==='object'){
      if(r.name)$('fName').value=String(r.name).slice(0,60);
      if(r.brand&&!brand)$('fBrand').value=String(r.brand).slice(0,40);
      if(CATS.some(c=>c[0]===r.category))draft.cat=r.category;
      if(/^#[0-9a-f]{6}$/i.test(r.color||'')){draft.color=r.color.toLowerCase();$('fColorFrom').textContent='from Claude'}
      if([1,2,3].includes(+r.warmth))draft.warmth=+r.warmth;
      if(Array.isArray(r.styles)){const s=r.styles.filter(x=>STYLES.some(y=>y[0]===x));if(s.length)draft.styles=s}
      paintForm();$('fStatus').textContent=draft.photo?'Filled in from your photo. Check it looks right.':'Filled in from what Claude knows about this item. Check the color.';
    }
  }catch(e){$('fStatus').textContent=aiError(e)}
  finally{$('aiFill').disabled=false}
};
$('askAI').onclick=async()=>{
  if(!sample||!items.length)return;
  const o=occ(),T=planTemp(),rain=!!(wx&&wx.rain);
  const list=items.map(i=>i.id+' | '+i.name+' | '+i.cat+' | '+colorName(i.color)+' '+i.color+' | warmth '+i.warmth+' | '+(i.styles||[]).join(',')+(i.brand?' | '+i.brand:'')).join('\n');
  $('askAI').disabled=true;$('aiNote').textContent='Claude is putting an outfit together…';
  try{
    const r=await sample.json('You are a personal stylist. Pick one outfit from this closet for '+o.label.toLowerCase()+'. Weather: about '+T+'°F'+(rain?', rain likely':'')+'.\nCloset (id | name | type | color | warmth 1-3 | good for | brand):\n'+list+'\nRules: use only ids from the list. Pick either a dress or a top and a bottom, plus shoes if there are any, plus outerwear if it is under 64°F or rainy, plus at most one extra. Think about color combinations.\nReply with JSON only: {"ids": [...], "why": "two short, friendly sentences about the colors and why it suits the weather and occasion"}',{modelTier:'default',cache:false});
    const ids=Array.isArray(r&&r.ids)?r.ids:[];
    const set=ids.map(id=>items.find(i=>i.id===id)).filter(Boolean);
    if(!set.length)throw{code:'bad'};
    current=set;renderOutfit(true);aiWhy=String(r.why||'').slice(0,400);renderOutfit(false);
    $('aiNote').textContent='Styled by Claude.';
  }catch(e){$('aiNote').textContent=aiError(e)}
  finally{$('askAI').disabled=false}
};
function connect(){
  if(!(window.claude&&typeof window.claude.use==='function'))return false;
  $('back').href='https://claude.ai/artifact/8XtxNzRVg4mMWQh9EwK3sc';
  window.claude.use('sample').then(s=>{if(!s)return;sample=s;$('askAI').hidden=false;$('aiRow').hidden=false}).catch(()=>{});
  return true;
}

/* ---------- start ---------- */
(async()=>{
  renderOcc();
  idb=await openDB();items=await dbAll();
  renderCloset();renderOutfit(false);
  if(!connect())window.addEventListener('load',()=>{if(!connect())setTimeout(connect,1500)});
  loadWeather();
})();
})();
