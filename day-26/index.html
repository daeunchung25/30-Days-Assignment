<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink | Day 26 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:#F4F6F5;font-family:"Inter",system-ui,-apple-system,sans-serif;color:#1C2422}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.ui{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;padding:0 18px;gap:10px;flex-wrap:wrap;pointer-events:none}
.ui>*{pointer-events:auto}
.ui a{color:#1C2422;opacity:.55;font-size:13px;text-decoration:none}
.ui a:hover{opacity:1}
.title{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:28px;opacity:.85}
.inks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid #1C2422;outline-offset:2px}
.btn{border:0;background:rgba(255,255,255,.7);border-radius:999px;padding:7px 13px;font:600 13px "Inter",sans-serif;cursor:pointer;color:#1C2422}
.hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;opacity:.5;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="A glass of water. Drag to drop ink that blooms and swirls, then slowly fades."></canvas>
<div class="ui">
  <a id="back" href="../">Day 26 of 30</a>
  <span class="title">Ink</span>
  <div class="inks"><span id="inks" class="inks" role="group" aria-label="Ink color"></span><button class="btn" id="clear" type="button">Clear water</button></div>
</div>
<p class="hint">Drag to drop ink. Drag fast to stir. It fades on its own.</p>
<script>
(function(){
const $=id=>document.getElementById(id);
const INKS=[
  {name:'Mixed',cols:null},
  {name:'Indigo',cols:[[38,52,140]]},
  {name:'Magenta',cols:[[200,30,110]]},
  {name:'Teal',cols:[[0,128,128]]},
  {name:'Saffron',cols:[[240,150,20]]},
  {name:'Black',cols:[[20,20,24]]}
];
const MIXED=[[38,52,140],[200,30,110],[0,128,128],[240,150,20],[120,40,160],[230,70,50]];
let ink=0;
const cv=$('cv'),ctx=cv.getContext('2d');
// the water keeps what you drew; each frame it clears a little, so ink slowly fades
const water=document.createElement('canvas'),wx=water.getContext('2d');
let W=0,H=0,dpr=1;
function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  for(const c of[cv,water]){c.width=W*dpr;c.height=H*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);wx.setTransform(dpr,0,0,dpr,0,0);
  wx.fillStyle='#FFFFFF';wx.fillRect(0,0,W,H)}
addEventListener('resize',size);size();

/* ---------- a smooth swirling current (curl of a noise field) ---------- */
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function field(x,y,t){return vn(x*.004+t,y*.004)+.5*vn(x*.009-t*.7,y*.009+t*.4)}
function curl(x,y,t){const e=2,a=field(x,y+e,t)-field(x,y-e,t),b=field(x+e,y,t)-field(x-e,y,t);return[a/(2*e)*320,-b/(2*e)*320]}

/* ---------- ink: thousands of soft little clouds that drift, spread and thin out ---------- */
let P=[];const MAX=2600;
function drop(x,y,vx,vy,n){
  const set=INKS[ink].cols||MIXED,base=INKS[ink].cols?set[0]:set[Math.floor(Math.random()*set.length)];
  for(let i=0;i<n;i++){if(P.length>MAX)P.shift();const a=Math.random()*Math.PI*2,s=Math.random()*2;
    const col=base.map(v=>Math.max(0,Math.min(255,v+(Math.random()-.5)*40)));
    P.push({x:x+Math.cos(a)*s*3,y:y+Math.sin(a)*s*3,vx:vx*.5+Math.cos(a)*s,vy:vy*.5+Math.sin(a)*s+.3,r:1.5+Math.random()*2.5,cap:10+Math.random()*22,life:0,max:520+Math.random()*520,col})}
}
let t=0,fadeT=0;
function step(){
  t+=.0016;
  // the water slowly clears
  wx.globalCompositeOperation='source-over';if((fadeT=(fadeT+1)%7)===0){wx.fillStyle='rgba(255,255,255,.03)';wx.fillRect(0,0,W,H);
    // and a tiny bit of pure light, so the last faint traces really disappear
    wx.globalCompositeOperation='lighter';wx.fillStyle='rgb(1,1,1)';wx.fillRect(0,0,W,H)}
  // ink mixes like real ink: darker where colors overlap
  wx.globalCompositeOperation='multiply';
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life++;
    const[cx,cy]=curl(p.x,p.y,t);p.vx=p.vx*.95+cx*.04;p.vy=p.vy*.95+cy*.04+.01;  // a little sinking, like real ink
    p.x+=p.vx;p.y+=p.vy;p.r=Math.min(p.cap,p.r+.06+p.r*.004);
    const k=p.life/p.max,a=(1-k)*(1-k)*.07;
    if(a>.002){const g=wx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'rgba('+p.col.join(',')+','+a+')');g.addColorStop(1,'rgba('+p.col.join(',')+',0)');wx.fillStyle=g;wx.beginPath();wx.arc(p.x,p.y,p.r,0,Math.PI*2);wx.fill()}
    if(p.life>p.max||p.y>H+60)P.splice(i,1)}
  wx.globalCompositeOperation='source-over';
}
function draw(){
  ctx.drawImage(water,0,0,W,H);
  ctx.globalCompositeOperation='multiply';ctx.fillStyle='#F2F5F4';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  // the glass: a soft light from the top and darker edges
  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,30,40,.07)');g.addColorStop(.12,'rgba(255,255,255,0)');g.addColorStop(.88,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,30,40,.07)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const l=ctx.createLinearGradient(0,0,0,H);l.addColorStop(0,'rgba(255,255,255,.35)');l.addColorStop(.25,'rgba(255,255,255,0)');ctx.fillStyle=l;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(W*.08,0,W*.015,H);
}
(function loop(){requestAnimationFrame(loop);step();step();draw()})();

/* ---------- input ---------- */
let down=false,last=null;
cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};drop(e.clientX,e.clientY,0,0,90)});
cv.addEventListener('pointermove',e=>{if(!down)return;const vx=e.clientX-last.x,vy=e.clientY-last.y;
  const n=Math.min(40,8+Math.hypot(vx,vy)*1.2);drop(e.clientX,e.clientY,vx,vy,n);
  // dragging fast stirs the ink that’s already there
  for(const p of P){const dx=p.x-e.clientX,dy=p.y-e.clientY,d2=dx*dx+dy*dy;if(d2<9000){const f=(1-d2/9000)*.25;p.vx+=vx*f;p.vy+=vy*f}}
  last={x:e.clientX,y:e.clientY}});
const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('inks').innerHTML=INKS.map((k,i)=>'<button class="sw" type="button" data-i="'+i+'" aria-label="'+k.name+'" title="'+k.name+'" aria-pressed="'+(i===0)+'" style="background:'+(k.cols?'rgb('+k.cols[0].join(',')+')':'conic-gradient('+MIXED.map(c=>'rgb('+c.join(',')+')').join(',')+')')+'"></button>').join('');
$('inks').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;ink=+b.dataset.i;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('clear').onclick=()=>{P=[];wx.fillStyle='#FFFFFF';wx.fillRect(0,0,W,H)};
// a first drop so the glass isn’t empty
setTimeout(()=>{drop(W*.42,H*.3,1,2,140);ink=2;drop(W*.58,H*.36,-1,2,120);ink=0},300);
function connect(){if(!(window.claude&&typeof window.claude.use==='function'))return false;$('back').href='https://claude.ai/artifact/8XtxNzRVg4mMWQh9EwK3sc';return true}
if(!connect())addEventListener('load',()=>{if(!connect())setTimeout(connect,1500)});
})();
</script>
</body>
</html>
