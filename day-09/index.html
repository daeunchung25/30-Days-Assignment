<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop | Day 9 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF2;--ink:#1F2630;--muted:#66707D;--line:#D2D9E0;--paper:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141820;--ink:#E9EDF2;--muted:#9AA4B1;--line:#2A313C;--paper:#1C222C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141820;--ink:#E9EDF2;--muted:#9AA4B1;--line:#2A313C;--paper:#1C222C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #4C8DF6;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top a{color:var(--muted);font-size:14px;text-decoration:none}
.top a:hover{text-decoration:underline}
.top h1{font-family:"Fredoka",sans-serif;font-weight:600;font-size:24px;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.big{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(34px,8vw,52px);line-height:1}
.big small{font-size:15px;color:var(--muted);font-family:"Nunito",sans-serif;font-weight:600;margin-left:6px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800;font-size:14px}
.btn:hover{border-color:var(--ink)}
.stage{position:relative;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(135deg,#C9D3DC,#B9C6D2)}
.stage canvas{display:block;width:100%;cursor:pointer}
.hint{position:absolute;inset:auto 0 14px 0;text-align:center;font-size:14px;color:rgba(30,40,50,.6);pointer-events:none;transition:opacity .4s}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a id="back" href="../">Day 9 of 30</a><h1>Pop</h1></div>
  <div class="bar">
    <div class="big" aria-live="polite"><span id="total">0</span><small>popped</small></div>
    <div class="tools">
      <button class="btn" id="snd" type="button" aria-pressed="true">Sound on</button>
      <button class="btn" id="next" type="button">New sheet</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="A sheet of bubble wrap. Press or swipe to pop the bubbles."></canvas>
    <div class="hint" id="hint">Press a bubble, or swipe across a row</div>
  </div>
  <div class="foot"><span id="sheetName"></span><span id="sheets"></span></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const SAVE='pop-day9';
let D={total:0,sheets:0,sound:true,n:0};
try{Object.assign(D,JSON.parse(localStorage.getItem(SAVE))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(D))}catch(e){}};

// sheets cycle through sizes and tints so it never feels the same
const KINDS=[
  {name:'Classic',size:22,tint:[255,255,255]},
  {name:'Big bubbles',size:11,tint:[255,255,255]},
  {name:'Pink',size:18,tint:[255,196,214]},
  {name:'Tiny bubbles',size:34,tint:[255,255,255]},
  {name:'Mint',size:18,tint:[190,240,222]},
  {name:'Sky',size:14,tint:[188,218,255]},
  {name:'Lemon',size:22,tint:[255,236,160]}
];

const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,sheet=null,next=null,slide=0,sliding=false,sprites=null;
const puffs=[];

function makeSheet(kind){
  const r=W/kind.size/2.2,dx=r*2.25,dy=r*1.98,b=[];
  const cols=Math.floor((W-r*1.2)/dx),rows=Math.floor((H-r*1.2)/dy);
  const ox=(W-(cols-1)*dx-dx/2)/2,oy=(H-(rows-1)*dy)/2;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)b.push({x:ox+i*dx+(j%2?dx/2:0),y:oy+j*dy,popped:false,t:0,seed:Math.random()});
  return{kind,r,b,left:b.length};
}
// draw each kind of bubble once, then stamp it, so it stays smooth
function makeSprites(kind,r){
  const s=Math.ceil(r*2+6),mk=()=>{const c=document.createElement('canvas');c.width=c.height=Math.ceil(s*dpr);const x=c.getContext('2d');x.scale(dpr,dpr);return[c,x]};
  const tint=kind.tint,c0=s/2;
  // intact bubble: clear dome with shadow, rim and a bright highlight
  const[a,ax]=mk();
  let g=ax.createRadialGradient(c0+r*.2,c0+r*.3,r*.2,c0,c0,r*1.05);
  g.addColorStop(0,'rgba('+tint.join(',')+',.55)');g.addColorStop(.75,'rgba('+tint.join(',')+',.42)');g.addColorStop(.95,'rgba(80,95,110,.35)');g.addColorStop(1,'rgba(80,95,110,0)');
  ax.fillStyle=g;ax.beginPath();ax.arc(c0,c0,r*1.05,0,7);ax.fill();
  ax.strokeStyle='rgba(255,255,255,.85)';ax.lineWidth=Math.max(1,r*.07);ax.beginPath();ax.arc(c0,c0,r*.93,Math.PI*.95,Math.PI*1.55);ax.stroke();
  ax.strokeStyle='rgba(60,75,90,.25)';ax.lineWidth=Math.max(1,r*.06);ax.beginPath();ax.arc(c0,c0,r*.95,Math.PI*.05,Math.PI*.75);ax.stroke();
  g=ax.createRadialGradient(c0-r*.35,c0-r*.4,0,c0-r*.35,c0-r*.4,r*.45);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
  ax.fillStyle=g;ax.beginPath();ax.ellipse(c0-r*.33,c0-r*.38,r*.38,r*.24,-.7,0,7);ax.fill();
  ax.fillStyle='rgba(255,255,255,.8)';ax.beginPath();ax.arc(c0+r*.42,c0+r*.38,r*.07,0,7);ax.fill();
  // popped bubbles: flat, wrinkled, a few versions
  const pops=[];
  for(let v=0;v<4;v++){const[p,px]=mk();
    px.fillStyle='rgba('+tint.join(',')+',.28)';px.beginPath();px.arc(c0,c0,r*.98,0,7);px.fill();
    px.strokeStyle='rgba(90,105,120,.28)';px.lineWidth=Math.max(1,r*.05);px.beginPath();px.arc(c0,c0,r*.96,0,7);px.stroke();
    px.lineCap='round';
    for(let k=0;k<5+v;k++){const a1=Math.random()*7,a2=a1+1.2+Math.random()*2,rr=r*(.25+Math.random()*.6);
      px.strokeStyle='rgba(255,255,255,.7)';px.lineWidth=Math.max(.8,r*.05);px.beginPath();px.moveTo(c0+Math.cos(a1)*rr,c0+Math.sin(a1)*rr);px.quadraticCurveTo(c0+(Math.random()-.5)*r*.6,c0+(Math.random()-.5)*r*.6,c0+Math.cos(a2)*rr*.8,c0+Math.sin(a2)*rr*.8);px.stroke();
      px.strokeStyle='rgba(70,85,100,.22)';px.lineWidth=Math.max(.6,r*.035);px.stroke()}
    pops.push(p)}
  return{s,a,pops};
}
function resize(){
  const w=cv.parentElement.clientWidth;dpr=Math.min(2,window.devicePixelRatio||1);
  W=w;H=Math.round(Math.min(window.innerHeight*.66,w*1.15));
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  const kind=sheet?sheet.kind:null;
  sheet=makeSheet(kind||KINDS[D.n%KINDS.length]);sprites=makeSprites(sheet.kind,sheet.r);
  $('sheetName').textContent=sheet.kind.name;
}
window.addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,150)});

function drawSheet(sh,spr,off){
  // the plastic sheet itself
  ctx.save();ctx.translate(0,off);
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,.5)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba('+sh.kind.tint.join(',')+',.18)';ctx.fillRect(0,0,W,H);
  const now=performance.now(),s=spr.s;
  for(const b of sh.b){
    if(!b.popped){ctx.drawImage(spr.a,b.x-s/2,b.y-s/2,s,s);continue}
    const k=Math.min(1,(now-b.t)/110);
    if(k<1){ctx.globalAlpha=1-k;const sc=1-k*.35;ctx.drawImage(spr.a,b.x-s*sc/2,b.y-s*sc/2,s*sc,s*sc);ctx.globalAlpha=k}
    ctx.drawImage(spr.pops[(b.seed*4)|0],b.x-s/2,b.y-s/2,s,s);ctx.globalAlpha=1;
  }
  // a soft sheen across the whole sheet
  const sh2=ctx.createLinearGradient(0,0,W,H*.6);sh2.addColorStop(0,'rgba(255,255,255,0)');sh2.addColorStop(.45,'rgba(255,255,255,.12)');sh2.addColorStop(.55,'rgba(255,255,255,0)');ctx.fillStyle=sh2;ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function frame(){
  requestAnimationFrame(frame);
  if(!sheet)return;
  ctx.clearRect(0,0,W,H);
  if(sliding){slide+=(1-slide)*.12;if(slide>.995){sliding=false;slide=0;sheet=next.sheet;sprites=next.spr;next=null;$('sheetName').textContent=sheet.kind.name}}
  drawSheet(sheet,sprites,-slide*H);
  if(next)drawSheet(next.sheet,next.spr,(1-slide)*H);
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.life-=.05;if(p.life<=0){puffs.splice(i,1);continue}p.x+=p.vx;p.y+=p.vy;ctx.fillStyle='rgba(255,255,255,'+(p.life*.6)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.4-p.life*.4),0,7);ctx.fill()}
}

/* ---------- popping ---------- */
function popAt(x,y){
  if(sliding||!sheet)return;
  const r=sheet.r;
  for(const b of sheet.b){if(b.popped)continue;const d=Math.hypot(b.x-x,b.y-y);if(d<r*1.02){
    b.popped=true;b.t=performance.now();sheet.left--;D.total++;
    for(let k=0;k<4;k++){const a=Math.random()*7;puffs.push({x:b.x,y:b.y,vx:Math.cos(a)*r*.06,vy:Math.sin(a)*r*.06,r:r*.18,life:1})}
    sound(r);if(navigator.vibrate)navigator.vibrate(8);
    $('total').textContent=D.total.toLocaleString('en-US');save();
    if(sheet.left===0)setTimeout(newSheet,450);
  }}
}
function newSheet(){
  if(sliding)return;
  D.n++;if(sheet&&sheet.left===0)D.sheets++;save();
  const kind=KINDS[D.n%KINDS.length],sh=makeSheet(kind);
  next={sheet:sh,spr:makeSprites(kind,sh.r)};sliding=true;slide=0;paintSheets();
  sound(0,'roll');
}
function paintSheets(){$('sheets').textContent=D.sheets?D.sheets+(D.sheets===1?' sheet finished':' sheets finished'):''}
let down=false,lx=0,ly=0;
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);down=true;audioOn();[lx,ly]=pt(e);popAt(lx,ly);$('hint').style.opacity=0});
cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pt(e),d=Math.hypot(x-lx,y-ly),st=Math.max(1,Math.ceil(d/(sheet.r*.5)));for(let i=1;i<=st;i++)popAt(lx+(x-lx)*i/st,ly+(y-ly)*i/st);lx=x;ly=y});
const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.tabIndex=0;
cv.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();audioOn();const b=sheet.b.find(b=>!b.popped);if(b)popAt(b.x,b.y)}});
$('next').onclick=()=>{audioOn();newSheet()};

/* ---------- the pop sound ---------- */
let ac=null,noise=null,bus=null;
function audioOn(){
  if(!D.sound)return;
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);bus=ac.createGain();bus.gain.value=.9;bus.connect(comp)}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function burst(t,f,q,g,dur,type){const s=ac.createBufferSource();s.buffer=noise;const fl=ac.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q;const gn=ac.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(gn);gn.connect(bus);s.start(t,Math.random()*.9);s.stop(t+dur+.01)}
function thump(t,f,g){const o=ac.createOscillator();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.45,t+.05);const gn=ac.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(gn);gn.connect(bus);o.start(t);o.stop(t+.07)}
function sound(r,kind){
  if(!D.sound||!ac)return;const t=ac.currentTime;
  if(kind==='roll'){burst(t,1200,.5,.12,.35,'lowpass');return}
  const big=Math.min(1,r/(W/22)),dud=Math.random()<.08; // a few bubbles always pop quietly
  const v=(dud?.35:1)*(.8+Math.random()*.4);
  burst(t,1800+Math.random()*2200-big*600,1.4,.55*v,.012+Math.random()*.01);   // the snap
  burst(t+.002,5000+Math.random()*3000,1,.18*v,.008);                          // the crack
  thump(t,130+Math.random()*60-big*40,.35*v*(.6+big*.6));                       // the air
}
$('snd').onclick=()=>{D.sound=!D.sound;$('snd').setAttribute('aria-pressed',D.sound);$('snd').textContent=D.sound?'Sound on':'Sound off';save();if(D.sound)audioOn()};

/* ---------- start ---------- */
$('total').textContent=D.total.toLocaleString('en-US');$('snd').setAttribute('aria-pressed',D.sound);$('snd').textContent=D.sound?'Sound on':'Sound off';paintSheets();
resize();requestAnimationFrame(frame);
function connect(){if(!(window.claude&&typeof window.claude.use==='function'))return false;$('back').href='https://claude.ai/artifact/8XtxNzRVg4mMWQh9EwK3sc';return true}
if(!connect())window.addEventListener('load',()=>{if(!connect())setTimeout(connect,1500)});
})();
</script>
</body>
</html>
