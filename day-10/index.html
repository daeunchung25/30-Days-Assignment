<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to eat | Day 10 of 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF1EA;--paper:#FFFFFF;--ink:#2B2220;--muted:#7A6B66;--line:#EBDDD5;--accent:#E9573F;--on-accent:#FFFFFF;--soft:#FFE7DD;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1514;--paper:#241D1C;--ink:#F3EAE6;--muted:#B3A39D;--line:#3A302D;--accent:#FF7A5E;--on-accent:#2A0C06;--soft:#3A2420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1514;--paper:#241D1C;--ink:#F3EAE6;--muted:#B3A39D;--line:#3A302D;--accent:#FF7A5E;--on-accent:#2A0C06;--soft:#3A2420;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.round{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding:18px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.top a{color:var(--muted);font-size:14px;text-decoration:none}
.top a:hover{text-decoration:underline}
.top h1{font-size:22px;margin:0}

.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;padding-top:24px;align-items:start}
.meals{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:16px}
.meals button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 6px;cursor:pointer;font-weight:800;font-size:15px;color:var(--muted)}
.meals button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.wheelbox{position:relative;max-width:520px;margin:0 auto}
.wheelbox canvas{display:block;width:100%;aspect-ratio:1;cursor:pointer;touch-action:manipulation}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));z-index:2}
.spin{display:block;margin:18px auto 0;border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:14px 40px;font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.spin:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.spin:disabled{opacity:.6;cursor:default}

.result{background:var(--paper);border:2px solid var(--accent);border-radius:20px;padding:18px 20px;margin-bottom:22px;text-align:center}
.result .lbl{font-size:14px;color:var(--muted);margin:0}
.result h2{font-size:clamp(30px,5vw,44px);line-height:1.05;margin:4px 0 12px}
.result .links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.btn:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.result.new{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card h3{font-size:18px;margin:0 0 4px}
.card p.sub{margin:0 0 10px;color:var(--muted);font-size:14px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;font-weight:700}
.chip small{color:var(--muted);font-weight:600}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;border-radius:999px}
.chip button:hover{color:var(--accent)}
.chip.no{opacity:.6}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:10px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.recent{font-size:14px;color:var(--muted);margin:8px 0 0}
@media (max-width:820px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a id="back" href="../">Day 10 of 30</a><h1 class="round">What to eat</h1></div>

  <div class="main">
    <section aria-label="Roulette">
      <div class="meals" id="meals" role="group" aria-label="Meal">
        <button type="button" data-m="breakfast">Breakfast</button>
        <button type="button" data-m="lunch">Lunch</button>
        <button type="button" data-m="dinner">Dinner</button>
      </div>
      <div class="wheelbox">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Food roulette wheel"></canvas>
      </div>
      <button class="spin round" id="spin" type="button">Spin</button>
    </section>

    <section>
      <div class="result" id="result" hidden aria-live="polite">
        <p class="lbl" id="resLbl"></p>
        <h2 class="round" id="resName"></h2>
        <div class="links">
          <a class="btn" id="near" target="_blank" rel="noopener">Find it nearby</a>
          <a class="btn" id="recipe" target="_blank" rel="noopener">How to make it</a>
          <button class="btn" id="nope" type="button">Not today</button>
        </div>
      </div>

      <div class="card">
        <h3 class="round">Things I don’t eat</h3>
        <p class="sub">Foods or ingredients, like mushrooms, cilantro, seafood, spicy, raw fish. The wheel leaves out anything with them.</p>
        <form class="inrow" id="dislikeForm" autocomplete="off">
          <input id="dislikeIn" type="text" placeholder="mushrooms, cucumber" aria-label="Something you don’t eat">
          <button class="btn" type="submit">Add</button>
        </form>
        <div class="chips" id="dislikes"></div>
      </div>

      <div class="card">
        <h3 class="round">On the wheel</h3>
        <p class="sub" id="poolInfo"></p>
        <div class="chips" id="onWheel"></div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn" id="shuffle" type="button">Shuffle options</button>
        </div>
        <label class="toggle"><input type="checkbox" id="noRepeat"> Skip what I had in the last 3 picks</label>
      </div>

      <div class="card">
        <h3 class="round">Add my own</h3>
        <p class="sub">Add a food you like to this meal’s wheel.</p>
        <form class="inrow" id="addForm" autocomplete="off">
          <input id="addIn" type="text" placeholder="Mom’s kimchi pancake" aria-label="Food to add">
          <button class="btn" type="submit">Add</button>
        </form>
        <div class="chips" id="mine"></div>
        <p class="recent" id="recent"></p>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- menus: name and what’s in it ---------- */
const MENU={
  breakfast:[
    ['Avocado toast','bread avocado egg'],['Bagel and cream cheese','bread dairy cheese'],['Pancakes','sweet egg dairy'],['Waffles','sweet egg dairy'],
    ['French toast','bread egg dairy sweet'],['Yogurt and granola','dairy nuts fruit sweet'],['Oatmeal with fruit','oats fruit banana'],['Egg sandwich','egg bread cheese bacon pork'],
    ['Breakfast burrito','egg cheese tortilla beans bacon pork spicy'],['Smoothie bowl','fruit banana sweet'],['Croissant','bread dairy butter'],['Eggs and toast','egg bread'],
    ['Rice porridge','rice'],['Egg rice with soy sauce','rice egg'],['Omelette','egg cheese mushroom onion vegetables'],['Hash browns','potato fried'],
    ['Onigiri','rice seaweed fish tuna'],['Cereal','dairy sweet'],['Fruit salad','fruit'],['Banana bread','banana nuts sweet bread'],['Toast with jam','bread sweet'],['Toast sandwich','bread egg cabbage ham pork sweet'],['Sweet potato and milk','sweet potato dairy']
  ],
  lunch:[
    ['Bibimbap','rice egg vegetables spinach bean sprouts carrot beef spicy mushroom'],['Kimbap','rice seaweed egg vegetables carrot cucumber spinach ham pork'],['Kimchi fried rice','rice kimchi spicy egg pork'],['Ramen','noodles pork egg soup'],
    ['Pho','noodles beef soup cilantro onion'],['Poke bowl','rice raw fish seafood avocado cucumber seaweed'],['Sushi','rice raw fish seafood seaweed'],['Caesar salad','lettuce cheese chicken vegetables dairy'],
    ['Burrito bowl','rice beans chicken cilantro spicy onion tomato'],['Deli sandwich','bread ham pork cheese lettuce tomato'],['Tomato pasta','pasta noodles tomato'],['Cream pasta','pasta noodles dairy cheese mushroom'],
    ['Pizza','bread cheese tomato dairy'],['Tteokbokki','rice cake spicy fish cake seafood'],['Bulgogi rice bowl','beef rice onion'],['Katsu curry','pork fried curry rice carrot potato'],
    ['Udon','noodles soup fish cake'],['Dumplings','pork vegetables cabbage'],['Chicken over rice','chicken rice spicy lettuce'],['Pad thai','noodles shrimp seafood peanuts nuts egg bean sprouts'],
    ['Burger and fries','beef bread cheese fried potato onion'],['Grain bowl','grains vegetables avocado'],['Japchae','noodles vegetables beef mushroom spinach carrot onion'],['Cold noodles','noodles beef cold cucumber egg'],['Chicken salad sandwich','chicken bread egg'],['Banh mi','bread pork cilantro carrot cucumber spicy']
  ],
  dinner:[
    ['Korean BBQ','beef pork grill lettuce garlic'],['Pork belly','pork grill lettuce garlic'],['Kimchi stew','kimchi pork tofu spicy soup'],['Soft tofu stew','tofu seafood spicy egg soup'],
    ['Soybean paste stew','tofu vegetables soup mushroom zucchini'],['Fried chicken','chicken fried'],['Steak','beef potato'],['Salmon and rice','fish seafood rice'],
    ['Hot pot','beef vegetables mushroom soup spicy tofu'],['Mapo tofu','tofu pork spicy rice'],['Green curry','chicken coconut spicy cilantro curry rice'],['Butter chicken','chicken curry dairy rice'],
    ['Tacos','beef tortilla cilantro onion spicy tomato'],['Lasagna','pasta beef cheese tomato dairy'],['Shabu-shabu','beef vegetables mushroom soup cabbage'],['Black bean noodles','noodles pork onion'],
    ['Spicy seafood noodle soup','noodles seafood shrimp squid spicy soup'],['Braised short ribs','beef carrot radish'],['Spicy stir-fried chicken','chicken spicy cabbage sweet potato rice cake'],['Mushroom risotto','rice mushroom dairy cheese'],
    ['Chicken stir-fry','chicken vegetables rice onion'],['Sushi platter','rice raw fish seafood'],['Ramen','noodles pork egg soup'],['Grilled mackerel','fish seafood rice'],['Bulgogi','beef onion rice mushroom'],['Pasta carbonara','pasta noodles egg pork bacon cheese dairy']
  ]
};
// words people type, mapped to what’s in the dishes
const SYN={
  meat:['beef','pork','chicken','ham','bacon','lamb'],seafood:['seafood','fish','shrimp','squid','raw fish','fish cake','tuna','salmon'],
  fish:['fish','raw fish','tuna','salmon','fish cake'],'raw fish':['raw fish'],sushi:['raw fish'],shellfish:['shrimp','squid'],
  veggie:['vegetables'],vegetable:['vegetables'],green:['vegetables','spinach','lettuce','cucumber','zucchini'],
  dairy:['dairy','cheese','butter'],milk:['dairy'],lactose:['dairy','cheese'],cheese:['cheese'],
  gluten:['bread','pasta','noodles'],bread:['bread'],carb:['bread','pasta','noodles','rice','potato'],
  nut:['nuts','peanuts'],peanut:['peanuts'],spice:['spicy'],hot:['spicy'],sweet:['sweet'],dessert:['sweet'],fried:['fried'],
  pork:['pork','ham','bacon'],beef:['beef'],chicken:['chicken'],egg:['egg'],mushroom:['mushroom'],onion:['onion'],
  // Korean words work too
  '버섯':['mushroom'],'오이':['cucumber'],'고수':['cilantro'],'매운':['spicy'],'매운거':['spicy'],'해산물':['seafood','fish','shrimp','squid','fish cake'],'생선':['fish','raw fish'],
  '회':['raw fish'],'양파':['onion'],'당근':['carrot'],'고기':['beef','pork','chicken','ham','bacon'],'돼지고기':['pork','ham','bacon'],'소고기':['beef'],'닭':['chicken'],'닭고기':['chicken'],
  '계란':['egg'],'달걀':['egg'],'우유':['dairy'],'유제품':['dairy','cheese','butter'],'치즈':['cheese'],'김치':['kimchi'],'두부':['tofu'],'면':['noodles','pasta'],'밀가루':['bread','pasta','noodles'],
  '새우':['shrimp'],'오징어':['squid'],'시금치':['spinach'],'콩나물':['bean sprouts'],'가지':['eggplant'],'토마토':['tomato'],'아보카도':['avocado'],'견과류':['nuts','peanuts'],'튀김':['fried'],'단거':['sweet']
};
function singular(w){w=w.trim().toLowerCase();if(/[가-힣]/.test(w))return w;if(w.endsWith('ies'))return w.slice(0,-3)+'y';if(w.endsWith('oes'))return w.slice(0,-2);if(w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);return w}
function termsFor(d){const s=singular(d);return SYN[s]||SYN[d.trim().toLowerCase()]||[s]}
function hits(dish,d){
  const name=dish[0].toLowerCase(),tags=' '+dish[1]+' ';
  return termsFor(d).some(t=>tags.includes(' '+t+' ')||tags.includes(' '+t)||name.includes(t));
}

/* ---------- saved stuff ---------- */
const SAVE='eat-day10';
let D={meal:null,dislikes:[],mine:{breakfast:[],lunch:[],dinner:[]},recent:[],noRepeat:true,removed:{breakfast:[],lunch:[],dinner:[]}};
try{const s=JSON.parse(localStorage.getItem(SAVE));if(s)D=Object.assign(D,s)}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(D))}catch(e){}};
if(!D.meal){const h=new Date().getHours();D.meal=h<11?'breakfast':h<16?'lunch':'dinner'}

/* ---------- building the wheel ---------- */
let slices=[];
function pool(){
  const m=D.meal,all=MENU[m].concat(D.mine[m].map(n=>[n,n.toLowerCase()]));
  const recentNames=D.noRepeat?D.recent.slice(0,3).map(r=>r.name):[];
  return all.filter(d=>!D.dislikes.some(x=>hits(d,x))&&!D.removed[m].includes(d[0])&&!recentNames.includes(d[0]));
}
function shuffleWheel(){
  const p=pool().slice();for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}
  // keep your own foods on the wheel when there’s room
  const mine=p.filter(d=>D.mine[D.meal].includes(d[0])),rest=p.filter(d=>!D.mine[D.meal].includes(d[0]));
  slices=mine.concat(rest).slice(0,10).sort(()=>Math.random()-.5).map(d=>d[0]);
  drawWheel();paintSide();
}

/* ---------- wheel drawing ---------- */
const COLORS=['#FFB4A2','#FFD6A5','#FDF3A7','#CAF2BF','#A8E6F0','#A0C4FF','#C8B6FF','#FFC6E5','#FFCFB0','#D4F0A8'];
const cv=$('wheel'),ctx=cv.getContext('2d');let size=0,rot=0;
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);size=r.width;cv.width=size*dpr;cv.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);drawWheel()}
new ResizeObserver(resize).observe(cv);
function drawWheel(){
  if(!size)return;const c=size/2,R=c-8,n=slices.length;ctx.clearRect(0,0,size,size);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.arc(c,c+4,R+4,0,7);ctx.fill();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--paper');ctx.beginPath();ctx.arc(c,c,R+4,0,7);ctx.fill();
  if(!n){ctx.fillStyle='#E7DCD6';ctx.beginPath();ctx.arc(c,c,R,0,7);ctx.fill();ctx.fillStyle='#7A6B66';ctx.font='700 '+Math.round(size*.04)+'px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('Nothing left to pick',c,c-6);ctx.fillText('Remove a dislike or add a food',c,c+size*.05);return}
  const a=Math.PI*2/n;
  for(let i=0;i<n;i++){
    const s=rot+i*a-Math.PI/2;
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,s,s+a);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate(s+a/2);ctx.fillStyle='#2B2220';ctx.textAlign='right';ctx.textBaseline='middle';
    let fs=Math.max(11,Math.min(size*.042,R*a*.38));ctx.font='700 '+fs+'px Nunito, sans-serif';
    let label=slices[i];const maxW=R*.7;while(ctx.measureText(label).width>maxW&&fs>10){fs-=1;ctx.font='700 '+fs+'px Nunito, sans-serif'}
    while(ctx.measureText(label).width>maxW&&label.length>4)label=label.slice(0,-2)+'…';
    ctx.fillText(label,R-14,0);ctx.restore();
  }
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--paper');ctx.beginPath();ctx.arc(c,c,R*.13,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#E9573F';ctx.beginPath();ctx.arc(c,c,R*.06,0,7);ctx.fill();
}

/* ---------- spinning ---------- */
let spinning=false,lastIdx=-1;
function idxAt(r){const n=slices.length,a=Math.PI*2/n;let p=((-r)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(p/a)%n}
function spin(){
  if(spinning||!slices.length)return;
  audioOn();spinning=true;$('spin').disabled=true;$('result').hidden=true;
  const start=rot,dist=Math.PI*2*(5+Math.random()*2)+Math.random()*Math.PI*2,dur=4200,t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,4);rot=start+dist*e;drawWheel();
    const i=idxAt(rot);if(i!==lastIdx){lastIdx=i;tick();}
    if(k<1)requestAnimationFrame(step);else done();
  })(t0);
}
function done(){
  spinning=false;$('spin').disabled=false;
  const name=slices[idxAt(rot)],m=D.meal;
  D.recent.unshift({name,meal:m,at:Date.now()});D.recent=D.recent.slice(0,10);save();
  const lbl={breakfast:'Breakfast is',lunch:'Lunch is',dinner:'Dinner is'}[m];
  $('resLbl').textContent=lbl;$('resName').textContent=name;
  $('near').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' near me');
  $('recipe').href='https://www.google.com/search?q='+encodeURIComponent(name+' recipe');
  const r=$('result');r.hidden=false;r.classList.remove('new');void r.offsetWidth;r.classList.add('new');
  ding();if(navigator.vibrate)navigator.vibrate([20,40,20]);paintSide();
}
$('spin').onclick=spin;cv.addEventListener('click',spin);
$('nope').onclick=()=>{const n=$('resName').textContent;if(n&&!D.removed[D.meal].includes(n)){D.removed[D.meal].push(n);save()}$('result').hidden=true;shuffleWheel()};

/* ---------- sounds ---------- */
let ac=null;
function audioOn(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tick(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=1800;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.025);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.03);if(navigator.vibrate)navigator.vibrate(4)}
function ding(){if(!ac)return;const t=ac.currentTime;[784,988,1319].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.12,t+i*.08+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.5);o.connect(g);g.connect(ac.destination);o.start(t+i*.08);o.stop(t+i*.08+.55)})}

/* ---------- side panels ---------- */
function paintSide(){
  document.querySelectorAll('#meals button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===D.meal));
  const m=D.meal,all=MENU[m].concat(D.mine[m].map(n=>[n,n.toLowerCase()]));
  $('dislikes').innerHTML=D.dislikes.length?D.dislikes.map((d,i)=>{const n=all.filter(x=>hits(x,d)).length;return '<span class="chip'+(n?'':' no')+'">'+esc(d)+' <small>'+(n?'removes '+n:'nothing on this menu')+'</small><button type="button" data-undis="'+i+'" aria-label="Remove '+esc(d)+'">×</button></span>'}).join(''):'';
  const p=pool();
  $('poolInfo').textContent=p.length+' of '+all.length+' '+m+' foods fit. The wheel shows up to 10 at a time, tap × to take one off.';
  $('onWheel').innerHTML=slices.map(s=>'<span class="chip">'+esc(s)+'<button type="button" data-off="'+esc(s)+'" aria-label="Take '+esc(s)+' off the wheel">×</button></span>').join('');
  const removed=D.removed[m];
  if(removed.length)$('onWheel').insertAdjacentHTML('beforeend','<span class="chip no">'+removed.length+' taken off <button type="button" id="bringBack" aria-label="Bring them back">↺</button></span>');
  $('mine').innerHTML=D.mine[m].map((n,i)=>'<span class="chip">'+esc(n)+'<button type="button" data-unmine="'+i+'" aria-label="Remove '+esc(n)+'">×</button></span>').join('');
  $('noRepeat').checked=D.noRepeat;
  const rec=D.recent.filter(r=>r.meal===m).slice(0,3).map(r=>r.name);
  $('recent').textContent=rec.length?'Recently picked: '+rec.join(', '):'';
}
$('meals').onclick=e=>{const b=e.target.closest('[data-m]');if(!b||spinning)return;D.meal=b.dataset.m;save();$('result').hidden=true;shuffleWheel()};
$('dislikeForm').onsubmit=e=>{e.preventDefault();const v=$('dislikeIn').value;v.split(/[,，、]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!D.dislikes.some(d=>d.toLowerCase()===x.toLowerCase()))D.dislikes.push(x)});$('dislikeIn').value='';save();shuffleWheel()};
$('addForm').onsubmit=e=>{e.preventDefault();const v=$('addIn').value.trim();if(!v)return;if(!D.mine[D.meal].includes(v))D.mine[D.meal].push(v);$('addIn').value='';save();shuffleWheel()};
document.addEventListener('click',e=>{
  const t=e.target;if(spinning)return;
  if(t.dataset.undis!=null){D.dislikes.splice(+t.dataset.undis,1);save();shuffleWheel()}
  else if(t.dataset.off!=null){D.removed[D.meal].push(t.dataset.off);save();shuffleWheel()}
  else if(t.dataset.unmine!=null){D.mine[D.meal].splice(+t.dataset.unmine,1);save();shuffleWheel()}
  else if(t.id==='bringBack'){D.removed[D.meal]=[];save();shuffleWheel()}
});
$('shuffle').onclick=()=>{if(!spinning)shuffleWheel()};
$('noRepeat').onchange=()=>{D.noRepeat=$('noRepeat').checked;save();shuffleWheel()};

shuffleWheel();
function connect(){if(!(window.claude&&typeof window.claude.use==='function'))return false;$('back').href='https://claude.ai/artifact/8XtxNzRVg4mMWQh9EwK3sc';return true}
if(!connect())window.addEventListener('load',()=>{if(!connect())setTimeout(connect,1500)});
})();
</script>
